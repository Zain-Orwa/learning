{id:"b12", title:"#include: who defined everything else?", start:"1:07:46", end:"1:11:58",
summary:"Keywords (blue) are built into the language. Everything else, like WinMain's types, CALLBACK and OutputDebugStringA, came from one line: #include <windows.h>. Casey explains that #include literally pastes another file's contents in place, opens windows.h to show it's mostly more includes, and previews Day 2: assembly, linking, the C runtime, and why WinMain isn't really the entry point.",
watchFor:[
 "At 1:07:59: blue keywords (`void`, `int`) work in any C compiler. Everything else had to come from somewhere.",
 "At 1:08:40: `#include` names a file. Forward slashes work everywhere; backslashes only on Windows.",
 "At 1:09:14: \"go get this file and stick the entire contents of it right here.\"",
 "At 1:09:34: right-click → Open Document jumps into the included file.",
 "At 1:09:52: windows.h is mostly *more* includes, so a dozen-line program becomes enormous.",
 "At 1:10:59: the Day 2 preview: assembly, linking, the C runtime library, and WinMain's \"misdirection\"."
],
deferred:["Macros, types and other things in windows.h (1:10:33): \"that we'll get into next week\".","Day 2 preview (1:11:05): stepping into the generated assembly, how linking actually works, the C runtime library, and why WinMain isn't the real entry point."],
explain:`<h3>Two kinds of names</h3>
<ul><li><b>Keywords</b>: <code>void</code>, <code>int</code>, plus punctuation like <code>{ } ( ) ;</code>. These are the language itself, and work on every C compiler.</li>
<li><b>Everything else</b>: <code>HINSTANCE</code>, <code>LPSTR</code>, <code>CALLBACK</code>, <code>OutputDebugStringA</code>, <code>WinMain</code>'s declaration. These are ordinary C declarations and macros written by Microsoft in header files.</li></ul>
<h3>#include is copy-paste</h3>
<p><code>#include</code> isn't really part of C's grammar. It's handled by the <b>preprocessor</b>, a text pass that runs before the compiler proper. It replaces the line with the full contents of the named file, and that file's own <code>#include</code>s get expanded the same way, recursively. What reaches the compiler is one long file: the translation unit from block 5.</p>
<div class="callout"><b>Putting today together:</b> windows.h supplies the <b>declarations</b> (block 11) for <code>OutputDebugStringA</code> and the rest, so the compiler is happy. The <b>definitions</b> live in Windows itself (kernel32.dll), and the linker connects the two through an import library (kernel32.lib) that Visual Studio links by default. Declaration from a header, definition from a library: same mechanism as foo, at a larger scale.</div>
<h3>&lt;angle&gt; vs. "quotes"</h3>
<p><code>#include &lt;windows.h&gt;</code> searches the system and SDK include folders. <code>#include "mine.h"</code> searches next to your file first. Casey doesn't cover this distinction today. It's here so the angle brackets don't puzzle you.</p>`,
experiment:`<ol><li><b>Measure the paste.</b> In the Native Tools prompt: <code>cl /P test.cpp</code>. This writes <code>test.i</code>, your file after preprocessing. Count its lines in PowerShell: <code>(Get-Content test.i).Count</code>. Expect tens of thousands, from a dozen-line file.</li>
<li>Open <code>test.i</code> and search for <code>OutputDebugStringA</code>. You'll find its <b>declaration</b>, a prototype ending in <code>;</code>, exactly like block 11's foo.</li>
<li>Prove that #include is just pasting: make <code>hello.h</code> containing only <code>OutputDebugStringA("pasted!\\n");</code> and write <code>#include "hello.h"</code> as a line <i>inside</i> WinMain's body. Build and run. It prints. (Don't actually write code this way. The point is that it's text substitution.)</li>
<li>See where the definitions come from: open your .exe in <a href="https://github.com/lucasg/Dependencies" target="_blank" rel="noopener">Dependencies</a> (open source) and find <b>KERNEL32.dll</b> → <code>OutputDebugStringA</code> among its imports.</li></ol>`,
questions:[
 {t:"1:07:59", q:"Which names in Casey's program are built into C, and which came from somewhere else?", a:"Built in: keywords like void and int, plus punctuation ({ } ( ) ;). Everything else (HINSTANCE, LPSTR, CALLBACK, OutputDebugStringA, WinMain's declaration) came from windows.h and the files it includes."},
 {t:"1:09:14", q:"What does #include literally do?", a:"Finds the named file and pastes its entire contents in place of the #include line, before compilation. Included files can include more files."},
 {t:"1:09:52", q:"Why is the program Casey compiles much longer than the dozen lines he typed?", a:"windows.h includes many other headers, which include more, and all that text is pasted into the translation unit. The compiler sees tens of thousands of lines."},
 {t:"1:08:55", q:"Why does Casey prefer forward slashes in include paths, even on Windows?", a:"Forward slashes work for includes on every platform. Backslashes only work on Windows."},
 {t:"1:10:33", q:"Tie it all together: windows.h gave the compiler what it needed to call OutputDebugStringA. Where's the actual code, and who connects the two?", a:"windows.h provides only the declaration. The definition is in Windows's own kernel32.dll. The linker resolves it through the kernel32 import library linked by default, and Windows wires it up when it loads the program.", hint:"Block 11: a declaration is enough to compile. Something else has to supply the body."}
],
cards:[
 ["What does `#include \"file\"` do?","Pastes the file's entire contents at that line, before compilation (done by the preprocessor)."],
 ["Keyword vs. header-defined name","Keywords belong to the language. Other names are declarations or macros from included files."],
 ["Why is windows.h so big?","It includes many other headers, which include more, recursively."],
 ["How do you see a file after preprocessing?","`cl /P file.cpp` → writes file.i."],
 ["Where is `OutputDebugStringA` defined?","In Windows's kernel32.dll. windows.h only declares it."],
 ["`<file.h>` vs `\"file.h\"`","Angle brackets: system/SDK include paths. Quotes: next to your file first."]
],
code:`<p>The finished Day 1 program with every line labeled by the block that explains it. Read this once a day for a week.</p>
<pre><code>#include &lt;windows.h&gt;          // b12: paste Windows declarations here (preprocessor)

// Function declaration
void foo(void);               // b11: enough for the compiler to emit a call

int CALLBACK WinMain(         // b06: the name the startup code calls (entry point)
                              // b10: int → exit code; CALLBACK → calling convention
    HINSTANCE hInstance,      // b07/b10: handle to this running program
    HINSTANCE hPrevInstance,  // b10: legacy, always 0
    LPSTR lpCmdLine,          // b07/b10: pointer to command-line text
    int nCmdShow)             // b10: normal/minimized/maximized
{
    foo();                    // b08: call → run foo's body, come back
    return 0;                 // b10: the int WinMain promised (Casey omits it; modern compilers may insist)
}                             // b09: statements end with ';', whitespace is free

// Function definition
void foo(void)                // b08: returns nothing, takes nothing
{
    OutputDebugStringA("This is the first thing we have actually printed.\\n");
                              // b08: declared in windows.h, defined in kernel32.dll
}
// Build: b03 compile → b05 .obj → b05 link → b06 .exe with entry point → Windows runs it</code></pre>`,
why:`<p>Every Handmade Hero file starts with includes, and Casey is unusually careful about them. He keeps windows.h out of the game code entirely, so the game layer never depends on the platform. That design comes later, but it rests on today's idea: an include is a paste, and what you paste defines what your code depends on.</p>
<p><b>Final check for Day 1:</b> close everything, open a blank file, and rebuild this program from memory, including the forward declaration. Then explain out loud what happens from double-clicking the .exe to the text appearing in the debugger. If you can do both, you own Day 1.</p>`}
);

window.STUDY.how = `<h2>How to study with this kit</h2>
<p>Each block takes you through the same seven steps, in this order. The yellow arrow marks where you are, like the instruction pointer in Visual Studio's debugger.</p>
<div class="loop"><span class="on">1 Watch</span><span>2 Explain</span><span>3 Experiment</span><span>4 Answer</span><span>5 Flashcards</span><span>6 Read code</span><span>7 Why it matters</span></div>
<ol>
<li><b>Watch</b> only the block's time range, at normal speed, with the "watch for" list open. Stop at the pause point and answer it before going on.</li>
<li><b>Explain</b>: read the notes. They follow Casey closely, add a prerequisite only where you'd otherwise get stuck, and fix the few things that changed since 2014.</li>
<li><b>Experiment</b>: do it with your own hands. Type the code; don't paste it. Break it on purpose and read the error.</li>
<li><b>Answer</b>: write answers from memory <i>before</i> you open the model answer. "Check my answer" grades your understanding and gives a follow-up question. The "Ask about this block" box stays inside the block's topic and tells you when something is parked for later.</li>
<li><b>Flashcards</b>: say each answer out loud, then flip. Marking the step done adds the cards to <b>Review</b>.</li>
<li><b>Read code</b>: read the annotated code in execution order and say what each line does.</li>
<li><b>Why it matters</b>: connect the block to Handmade Hero and to the CPU. This is what makes it stick.</li></ol>
<h3>A schedule that works</h3>
<table><thead><tr><th>When</th><th>What</th><th>Time</th></tr></thead><tbody>

<li><b>Doing it yourself.</b> Typing code, breaking it and reading errors builds the kind of memory that reading alone can't.</li>

  ["code","Read code"],["cards","Flashcards"],["why","Why it matters"]
];
const SHORT_BREAK=5, LONG_BREAK=15, LONG_EVERY=3; // minutes; a long break after every 3 parts
const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today = ()=>Math.floor(Date.now()/86400000);
const secs = t=>String(t).split(":").reduce((a,x)=>a*60+(+x),0);
const fmt = s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")};
const md = s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");

$("#eyebrow").textContent=D.eyebrow||""; $("#h1").textContent=D.title||document.title;

/* ---------- state + persistence ---------- */
const FRESH={v:2,cur:D.blocks[0].id,step:"watch",tab:"path",done:{},completed:{},vt:{},recall:{},cmp:{},guess:{},rfb:{},cdate:{},ivans:{},ivfb:{},dbgs:{},dbgans:{},dbgfb:{},session:null,park:{},answers:{},fb:{},cards:{},notes:{},speed:1,lastVisit:0,sessionParts:0,brk:null,stopped:false};
let S=JSON.parse(JSON.stringify(FRESH));
const LS=D.storageKey||"study-kit";
try{const raw=localStorage.getItem(LS); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}
const localLast=S.lastVisit||0;
S.stopped=false; // opening the page again always means "continue"
let welcome = S.lastVisit && (Date.now()-S.lastVisit>30*60*1000) && Object.keys(S.done).length>0;
if(welcome){S.sessionParts=0; S.brk=null; S.stopped=false; S.session=null;}
S.lastVisit=Date.now();
let dbRef=null, saveT=null;
function save(){
  S.lastVisit=Date.now();
  try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}
  clearTimeout(saveT);
  if(dbRef) saveT=setTimeout(()=>{dbRef.set({json:JSON.stringify(S),at:Date.now()}).then(()=>setSaved("saved to your account")).catch(()=>setSaved("saved in this browser"));},1500);
  if(helperReady) saveT=setTimeout(()=>{postHelper("/api/progress").then(r=>{setSaved("saved in your repo");if(r&&r.addedReviews&&r.addedReviews.length)toast(r.addedReviews.length+" items added to your review schedule");}).catch(()=>setSaved("saved in this browser"));},1500);
}
/* ---------- helper mode: ./study runs a small local helper (serve.py) ---------- */
const HELPER_PAGE=/^https?:$/.test(location.protocol)&&!window.claude;
const kitPath=decodeURIComponent(location.pathname).replace(/^\/courses\//,"").replace(/\/study-kit\.html$/,"");
let helperReady=false, videoFolder=null;
function helperMeta(){
  return {kit:kitPath,unitPrefix:D.unitPrefix||D.storageKey,unitLabel:D.unitLabel||D.title,
    completedParts:D.blocks.filter(b=>S.completed[b.id]).map(b=>({id:b.id,n:idxOf(b)+1,title:b.title,date:S.cdate[b.id]||new Date().toISOString().slice(0,10),interview:(b.interview||[]).map(iv=>({area:iv.area,q:iv.q})),debug:(b.debug||[]).map(c=>({title:c.title,level:c.level}))}))};
}
function postHelper(url,extra){
  S.finished=allDone();
  return fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({meta:helperMeta(),state:S,position:positionBlock()},extra||{}))}).then(r=>r.json());
}
async function helperCall(input,json){
  const prompt=typeof input==="string"?input:input.map(m=>(m.role==="user"?"STUDENT: ":"TUTOR: ")+m.content).join("\n\n");
  const r=await (await fetch("/api/claude",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt,json})})).json();
  if(r.error) throw {code:"upstream_error",message:r.error,text:r.text};
  return r;
}
const helperSample=async(input,opts={})=>{const r=await helperCall(input,false);opts.onText&&opts.onText({text:r.text,delta:r.text});return {text:r.text,truncated:false}};
helperSample.json=async input=>(await helperCall(input,true)).data;
(async()=>{
  if(!HELPER_PAGE) return;
  try{
    const ping=await (await fetch("/api/ping")).json(); if(!ping.ok) return;
    const remote=await (await fetch("/api/progress?kit="+encodeURIComponent(kitPath))).json();
    if(remote&&remote.lastVisit&&remote.lastVisit>=localLast){
      S=Object.assign(JSON.parse(JSON.stringify(FRESH)),remote);
      S.stopped=false;
      welcome=(Date.now()-remote.lastVisit>30*60*1000)&&Object.keys(S.done).length>0;
      if(welcome){S.sessionParts=0;S.brk=null;S.stopped=false;S.session=null;}
    }
    if(ping.claude) sample=helperSample;
    if(D.video&&D.video.file){const v=await (await fetch("/api/video?file="+encodeURIComponent(D.video.file))).json();
      if(v.exists){videoURL="/video/"+encodeURIComponent(D.video.file);vid.src=videoURL;} else videoFolder=v.folder;}
    helperReady=true; setSaved("saved in your repo"); save(); safeRender();
  }catch(e){}
})();
function setSaved(t){$("#saved").textContent=t}
(async()=>{
  try{
    if(!window.claude) return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;

  }catch(e){dbRef=null}
})();
let sample=null, downloads=null;
(async()=>{try{if(window.claude){sample=await claude.use("sample"); safeRender();}}catch(e){}})();
(async()=>{try{if(window.claude){downloads=await claude.use("downloads");}}catch(e){}})();
function safeRender(){ if(vid && !vid.paused) return; render(); }
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove("on"),2000)}
async function copy(text,box){
  try{await navigator.clipboard.writeText(text);toast("Copied. Paste it to Claude.");}
  catch(e){ if(box){box.innerHTML=`<textarea readonly>${esc(text)}</textarea><p class="small muted">Select all and copy this, then paste it to Claude.</p>`; box.querySelector("textarea").select();} }

/* ---------- helpers ---------- */
const blockById=id=>D.blocks.find(b=>b.id===id);
const idxOf=b=>D.blocks.indexOf(b);
function stepsFor(b){return STEPS.filter(([k])=>["watch","recall","ask","cards"].includes(k)||b[k])}
function blockDone(b){const d=S.done[b.id]||{};return stepsFor(b).filter(([k])=>d[k]).length}
function frontier(){const i=D.blocks.findIndex(b=>!S.completed[b.id]);return i===-1?D.blocks.length:i}
const allDone=()=>frontier()>=D.blocks.length;
const unlocked=b=>idxOf(b)<=frontier();
function stepOpen(b,k){const st=stepsFor(b),i=st.findIndex(([x])=>x===k),d=S.done[b.id]||{};return d[k]||st.slice(0,i).every(([x])=>d[x])}
function allCards(){const out=[];D.blocks.forEach(b=>(b.cards||[]).forEach((c,i)=>out.push({id:b.id+"#"+i,b,c})));return out}
function dueCards(){const t=today();return allCards().filter(x=>{const s=S.cards[x.id];return s&&s.due<=t})}
function progress(){let tot=0,dn=0;D.blocks.forEach(b=>{tot+=stepsFor(b).length;dn+=blockDone(b)});return tot?Math.round(dn*100/tot):0}
function rateCard(id,g){
  const s=S.cards[id]||{ease:2.5,int:0,reps:0};
  if(g===0){s.reps=0;s.int=0;s.ease=Math.max(1.3,s.ease-.2)}
  else{ s.reps++; if(s.reps===1)s.int=g===3?3:1; else if(s.reps===2)s.int=g===1?3:6; else s.int=Math.round(s.int*(g===1?1.2:g===3?s.ease*1.3:s.ease)); s.ease=Math.max(1.3,s.ease+(g===1?-.15:g===3?.15:0)); }
  s.due=today()+s.int; S.cards[id]=s; save();
}
function blockContext(b){
  const strip=h=>String(h||"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
  return `VIDEO: "${D.title}"${D.eyebrow?" ("+D.eyebrow+")":""}.
PART: ${b.title} (${b.start}-${b.end})
WHAT CASEY COVERS: ${b.summary}
STUDY NOTES: ${strip(b.explain).slice(0,3500)}
TOPICS CASEY PARKS FOR LATER (do not teach these; say they come later): ${(D.parked||[]).map(p=>p.what+" ["+p.where+"]").join("; ")}`;
}

/* ---------- the video player (one element, kept alive across renders) ---------- */
let videoURL=null, playerBlock=null, lastSave=0;
const vw=document.createElement("div"); vw.className="player";
vw.innerHTML=`<video playsinline preload="metadata"></video>
<div class="pctl"><button data-v="play" aria-label="Play or pause">Play</button><button data-v="back" aria-label="Back 10 seconds">−10s</button>
<span class="pbar" role="slider" aria-label="Position in this part" tabindex="0"><i></i></span><span class="ptime">0:00 / 0:00</span>
<button data-v="speed" aria-label="Playback speed">1×</button><button data-v="replay">Replay part</button><button data-v="fs">Full screen</button></div>
<div class="pend" hidden><b>End of this part</b><span>The video stops here. Now recall what you just saw.</span><div class="row"><button class="btn" data-v="next">Next: Recall →</button><button class="btn ghost" data-v="replay">Replay part</button></div></div>`;
const vid=vw.querySelector("video");
const range=b=>[secs(b.start),secs(b.end)];
function ptick(){
  const b=playerBlock; if(!b||!vid.duration) return;
  const [st,en]=range(b);
  if(vid.currentTime<st-0.4){vid.currentTime=st}
  if(vid.currentTime>=en-0.05){ if(!vid.paused) vid.pause(); if(Math.abs(vid.currentTime-en)>0.2) vid.currentTime=en; partEnded(); }
  const t=Math.min(Math.max(vid.currentTime,st),en);
  vw.querySelector(".pbar i").style.width=((t-st)/(en-st)*100)+"%";
  vw.querySelector(".ptime").textContent=fmt(t-st)+" / "+fmt(en-st);
  vw.querySelector('[data-v="play"]').textContent=vid.paused?"Play":"Pause";
  if(Date.now()-lastSave>3000){lastSave=Date.now();S.vt[b.id]=t;save();}
}
(function loop(){ if(!vid.paused) ptick(); requestAnimationFrame(loop); })();
vid.addEventListener("timeupdate",ptick); vid.addEventListener("pause",ptick); vid.addEventListener("play",()=>{vw.querySelector(".pend").hidden=true;ptick()});
vid.addEventListener("seeking",()=>{const b=playerBlock;if(!b)return;const [st,en]=range(b);if(vid.currentTime<st)vid.currentTime=st;if(vid.currentTime>en)vid.currentTime=en;});
vid.addEventListener("loadedmetadata",()=>{seekResume();ptick();});
function seekResume(){const b=playerBlock;if(!b||!vid.duration)return;const [st,en]=range(b);let t=S.vt[b.id];if(!(t>=st&&t<en-1))t=st;vid.currentTime=t;vid.playbackRate=S.speed||1;vw.querySelector('[data-v="speed"]').textContent=(S.speed||1)+"×";}
function partEnded(){
  const b=playerBlock; if(!b) return;
  vw.querySelector(".pend").hidden=false; S.vt[b.id]=range(b)[1];
  const d=(S.done[b.id]=S.done[b.id]||{}); if(!d.watch){d.watch=true;save();const st=$(".steps [data-step='watch']");if(st)st.classList.add("done");const nb=$("#markNext");if(nb)nb.textContent="Next step →";}
}
vw.addEventListener("click",e=>{
  const t=e.target.closest("[data-v]"); const b=playerBlock;
  if(t&&b){const [st,en]=range(b),v=t.dataset.v;
    if(v==="play"){ if(vid.paused){ if(vid.currentTime>=en-0.1) vid.currentTime=st; vid.play().catch(()=>{}); } else vid.pause(); }
    if(v==="back"){vid.currentTime=Math.max(st,vid.currentTime-10)}
    if(v==="replay"){vw.querySelector(".pend").hidden=true;vid.currentTime=st;vid.play().catch(()=>{})}
    if(v==="speed"){const sp=[1,1.25,1.5,1.75,2,0.75];S.speed=sp[(sp.indexOf(S.speed||1)+1)%sp.length];vid.playbackRate=S.speed;t.textContent=S.speed+"×";save()}
    if(v==="fs"){ if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); else vw.requestFullscreen?.().catch(()=>toast("Full screen isn't available here")); }
    if(v==="next"){ if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); goNextStep(); }
    ptick(); return;}
  const bar=e.target.closest(".pbar"); if(bar&&b){const r=bar.getBoundingClientRect(),[st,en]=range(b);vid.currentTime=st+(en-st)*Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));ptick();}
});
function loadVideo(file){
  if(!file) return;
  if(videoURL) URL.revokeObjectURL(videoURL);
  videoURL=URL.createObjectURL(file); vid.src=videoURL;
  if(D.video&&D.video.file&&file.name!==D.video.file) toast("Loaded "+file.name+" (expected "+D.video.file+")"); else toast("Video loaded");
  render();
}
document.addEventListener("keydown",e=>{
  if(!playerBlock||!vw.isConnected) return;
  if(e.target.closest&&e.target.closest("input,textarea,select,button")) return;
  if(e.code==="Space"){e.preventDefault();vw.querySelector('[data-v="play"]').click()}
  if(e.code==="ArrowLeft"){e.preventDefault();const [st]=range(playerBlock);vid.currentTime=Math.max(st,vid.currentTime-5)}
});

  $("#tabs").innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" aria-pressed="${S.tab===k}">${l}${k==="review"&&due?`<span class="badge">${due}</span>`:""}</button>`).join("");

$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.tab=b.dataset.tab;save();render();window.scrollTo({top:0})});

/* ---------- path view ---------- */
function stackHTML(cur){
  const f=frontier();
  const items=D.blocks.map((x,i)=>{
    const n=blockDone(x),t=stepsFor(x).length;
    if(i>f) return `<li><div class="locked"><span></span><span><span class="t">Part ${i+1}</span><span class="ts">locked</span></span><span class="ck">🔒︎</span></div></li>`;
    return `<li><button data-blk="${x.id}" aria-current="${x.id===cur}"><span class="arrow"></span><span><span class="t">${i+1}. ${esc(x.title)}</span><span class="ts">${x.start}–${x.end}${n<t?` · ~${n?estLeft(x):est(x)} min`:""}</span></span><span class="ck ${n===t?"full":""}">${n===t?"done":n+"/"+t}</span></button></li>`;
  });
  if(D.qa){ const open=allDone(); items.push(open?`<li><button data-blk="__qa" aria-current="${cur==="__qa"}"><span class="arrow"></span><span><span class="t">Q&amp;A</span><span class="ts">${esc(D.qa.label||"after the video")}</span></span><span class="ck"></span></button></li>`
    :`<li><div class="locked"><span></span><span><span class="t">Q&amp;A</span><span class="ts">locked</span></span><span class="ck">🔒︎</span></div></li>`); }
  return `<aside class="stack" aria-label="Parts"><div class="hd"><span>CALL STACK · ${D.blocks.length} parts</span><span>${Object.keys(S.completed).length} done</span></div><ol>${items.join("")}</ol></aside>`;
}
function welcomeHTML(){
  if(!welcome) return "";
  const b=blockById(S.cur), due=dueCards().length, step=(STEPS.find(([k])=>k===S.step)||[])[1]||"";
  const where = S.cur==="__qa" ? "the Q&amp;A" : allDone() ? "the end of the video" : `Part ${idxOf(b)+1}, <b>${esc(b.title)}</b>, step <b>${step}</b>`;
  return `<div class="welcome"><b>Welcome back.</b> You stopped at ${where}.
  ${due?`<div class="row"><button class="btn" data-go="warmup">Warm up: ${due} card${due>1?"s":""} due</button><button class="btn ghost" data-go="continue">Skip warm-up, continue</button></div>`:`<div class="row"><button class="btn" data-go="continue">Continue</button></div>`}</div>`;
}
/* ---------- time: estimates and the session planner ---------- */
const est=b=>{const [st,en]=range(b);return Math.round((en-st)/60*1.3+30)};
const estLeft=b=>Math.max(5,Math.round(est(b)*(1-blockDone(b)/stepsFor(b).length)));
function sessionActive(){const x=S.session;return x&&(Date.now()-x.start)<(x.min*60000+3*3600000)}
function minsLeft(){const x=S.session;return x?Math.round((x.start+x.min*60000-Date.now())/60000):null}
function planHTML(){
  if(S.brk||S.stopped||allDone()) return "";
  if(!sessionActive()) return `<div class="plan"><b>How much time do you have today?</b> I'll plan what fits and tell you when to wrap up.
    <div class="timechips">${[30,45,60,90,120,180].map(m=>`<button class="btn ghost small" data-sess="${m}">${m<60?m+" min":(m/60)+" h"}</button>`).join("")}<button class="btn ghost small" data-sess="0">No limit</button></div></div>`;
  const x=S.session, left=minsLeft(), due=dueCards().length;
  if(!x.min) return "";
  let budget=Math.max(0,left-10), items=[];
  if(due){const w=Math.min(Math.ceil(due*0.6),Math.round(x.min*0.15)||3);items.push(`Warm-up: ${due} review card${due>1?"s":""} (~${w} min)`);budget-=w;}
  let i=frontier(), first=true;
  while(i<D.blocks.length){const b=D.blocks[i],need=first?estLeft(b):est(b);
    if(need>budget&&!first) break;
    items.push(`${first&&blockDone(b)?"Finish":"Do"} Part ${i+1}: ${esc(b.title)} (~${need} min)${need>budget?" — may not fit fully; stop at the end of a step":""}`);
    budget-=need; first=false; i++; if(budget<=0) break;}
  items.push("Last 10 min: Interview corner, then Stop for today → Copy position");
  const warn=left<=10;
  return `<div class="plan ${warn?"warn":""}"><b>${warn?(left>0?`${left} min left: finish this step, then press “Finish part” or Stop for today.`:"Time's up. Finish this step and stop for today."):`Today's plan (${x.min>=60?(x.min/60)+" h":x.min+" min"})`}</b>
    ${warn?"":`<ol>${items.map(t=>`<li>${t}</li>`).join("")}</ol>`}
    <div class="row"><button class="btn ghost small" data-sess="reset">Change time</button>${warn?`<button class="btn small" data-go="stop">Stop for today</button>`:""}</div></div>`;
}
let warned=false;
function updateTimer(){
  const el=$("#timer"); if(!el) return;
  if(!sessionActive()||!S.session.min){el.hidden=true;return}
  const l=minsLeft(); el.hidden=false; el.textContent=l>0?`${l} min left`:"time's up"; el.classList.toggle("low",l<=10);
  if(l<=10&&!warned){warned=true;toast("10 minutes left. Finish this step, then stop.");}
}
setInterval(updateTimer,30000);

function ivPrompt(b,iv,ans){
  return `Act as a technical interviewer at a game or systems company, grading a junior candidate's answer. ${GRADE_RULES} Use the checklist as the 100% answer. The guiding question should be the follow-up a real interviewer would ask.
Only expect what the course has covered so far: ${blockContext(b)}
INTERVIEW QUESTION: ${iv.q}
CHECKLIST (with weights): ${(iv.strong||[]).map(([t,p])=>t+" ("+p+"%)").join("; ")}
RED FLAGS: ${(iv.redflags||[]).join("; ")||"none"}

/* ---------- debug challenges ---------- */
function dbgBlock(b,i,c,full){
  const id=b.id+":"+i, st=S.dbgs[id], fb=S.dbgfb[id];
  const head=`<div class="qn">DEBUG · level ${c.level} · target ${fmt(c.target||120)}</div><div class="qt">${md(c.title)}</div>`;
  if(!full) return `<div class="q dbg">${head}${fb?renderScore(fb)+(fb.secs?`<p class="clock">Solved in ${fmt(fb.secs)} (target ${fmt(c.target||120)})</p>`:""):`<p class="small muted">Not tried yet.</p>`}</div>`;
  if(!st) return `<div class="q dbg">${head}<p class="small muted">Read nothing yet. When you're ready, start the clock.</p><div class="row"><button class="btn" data-dbgstart="${id}">Start challenge</button></div></div>`;
  return `<div class="q dbg">${head}${c.scenario}<p><b>Task:</b> ${md(c.task)}</p>
  <textarea data-dbg="${id}" placeholder="Cause, how you found it, fix, how you'd verify…">${esc(S.dbgans[id]||"")}</textarea>
  <div class="row">${sample?`<button class="btn" data-dbgcheck="${id}">Grade my debugging</button>`:`<button class="btn ghost" data-dbgcopy="${id}">Copy for Claude to grade</button>`}<span class="clock" data-clock="${id}">${fb&&fb.secs?`Solved in ${fmt(fb.secs)}`:""}</span></div>

  <div class="copybox" id="dbgcb-${id}"></div><div id="dbgfb-${id}">${fb?renderScore(fb):""}</div>

const GRADE_RULES=`Grade STRICTLY, in percent. Score = how much of the full correct answer the student gave. A vague or half-right point gets partial credit. A wrong statement costs points even if the rest is right. List what is right, and every missing or wrong piece with the percent it is worth, so right + missing = 100. Do NOT reveal the full answer: if below 100, ask ONE guiding question that leads the student to the missing piece. If the gap is something Casey explains in the video, give the time range to rewatch. Simple English.`;

  ${fb.rewatch?`<p class="small muted" style="margin:6px 0 0">Rewatch: ${esc(fb.rewatch)}</p>`:""}</div>`;
}

}
function renderTools(){
  return `<section class="block"><h2>Toolbox</h2><div class="toolgrid">${(D.tools||[]).map(t=>`<div class="tool"><div class="k">${esc(t.role)}</div><h3><a href="${t.url}" target="_blank" rel="noopener">${esc(t.name)}</a></h3><p class="small">${md(t.use)}</p></div>`).join("")}</div></section>`;
}
function renderHow(){return `<section class="block"><div class="pane">${D.how||""}</div></section>`}

/* ---------- render + events ---------- */
function render(){
  if(vw.isConnected){vid.pause();vw.remove();}
  playerBlock=null;
  renderTabs();
  const p=progress(); $("#pct").textContent=p+"%"; $("#pctbar").style.width=p+"%";
  $("#view").innerHTML = S.tab==="path"?renderPath():S.tab==="review"?renderReview():S.tab==="interview"?renderInterviewTab():S.tab==="parked"?renderParked():S.tab==="tools"?renderTools():renderHow();
  updateTimer();
  const slot=$("#vslot");
  if(slot){ playerBlock=blockById(S.cur); slot.replaceWith(vw); vw.querySelector(".pend").hidden=true; seekResume(); ptick(); }
  const drop=$("#drop");
  if(drop){ $("#vfile").addEventListener("change",e=>loadVideo(e.target.files[0]));
    drop.addEventListener("dragover",e=>{e.preventDefault();drop.classList.add("over")}); drop.addEventListener("dragleave",()=>drop.classList.remove("over"));
    drop.addEventListener("drop",e=>{e.preventDefault();drop.classList.remove("over");loadVideo(e.dataTransfer.files[0])}); }
  if(S.brk&&S.brk.until&&!brkTimer) brkTimer=setInterval(tickBreak,500);
  if($("#nextbox")&&!S.stopped) showNext();
}
function goNextStep(){
  const b=blockById(S.cur); if(!b) return;
  (S.done[b.id]=S.done[b.id]||{})[S.step]=true;
  if(S.step==="cards"){b.cards.forEach((c,i)=>{const id=b.id+"#"+i;if(!S.cards[id])S.cards[id]={ease:2.5,int:0,reps:0,due:today()+1}});toast(b.cards.length+" cards added to Review")}
  const st=stepsFor(b),i=st.findIndex(([k])=>k===S.step);
  if(i<st.length-1){S.step=st[i+1][0];}
  else{
    S.completed[b.id]=true; S.cdate[b.id]=new Date().toISOString().slice(0,10); S.sessionParts=(S.sessionParts||0)+1;
    const nb=D.blocks[idxOf(b)+1];
    if(nb){S.cur=nb.id;S.step="watch";S.brk={from:b.id,until:null};}
    else{S.cur=D.qa?"__qa":b.id; toast("Last part finished");}
  }
  save();render();window.scrollTo({top:0});
}
function addPark(){
  const b=blockById(S.cur), inp=$("#parkin"); const t=inp.value.trim(); if(!t||!b) return;
  (S.park[b.id]=S.park[b.id]||[]).push({t,at:Math.max(0,(vid.currentTime||secs(b.start))-secs(b.start)),status:"open"});
  inp.value=""; save(); $("#plist").innerHTML=parkItems(b,false); toast("Parked. Keep watching.");
}
$("#view").addEventListener("keydown",e=>{ if(e.target.id==="parkin"&&e.key==="Enter"){e.preventDefault();addPark();} });
$("#view").addEventListener("click",async e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.go){const g=t.dataset.go;
    if(g==="continue"){welcome=false;S.tab="path";save();render();return}
    if(g==="warmup"){welcome=true;S.tab="review";revQueue=null;save();render();return}
    if(g==="startbreak"){S.brk.until=Date.now()+(+t.dataset.min)*60000;save();render();return}
    if(g==="afterbreak"){if(S.sessionParts%LONG_EVERY===0&&S.brk&&S.brk.until)S.sessionParts=0;S.brk=null;save();render();window.scrollTo({top:0});return}
    if(g==="stop"){S.brk=null;S.stopped=true;S.session=null;save();render();if(helperReady)finishSync();return}
    if(g==="resume"){S.stopped=false;save();render();return}
    if(g==="copypos"){copy(positionText(),$("#poscb"));return}
  }
  if(t.dataset.blk){welcome=false;S.cur=t.dataset.blk;const b=blockById(S.cur);S.step=b?(stepsFor(b).find(([k])=>!(S.done[b.id]||{})[k])||["watch"])[0]:"watch";save();render();$(".block")?.scrollIntoView({block:"start"});return}
  if(t.dataset.step){S.step=t.dataset.step;save();render();return}
  if(t.id==="markNext"){welcome=false;goNextStep();return}
  if(t.id==="parkgo"){addPark();return}
  if(t.dataset.sess){const v=t.dataset.sess;if(v==="reset"){S.session=null;}else{S.session={start:Date.now(),min:+v};warned=false;}welcome=false;save();render();return}
  if(t.dataset.dbgstart){S.dbgs[t.dataset.dbgstart]=Date.now();save();render();return}
  if(t.dataset.dbgcopy||t.dataset.dbgcheck){const id=t.dataset.dbgcopy||t.dataset.dbgcheck,[bid,qi]=id.split(":"),b=blockById(bid),c=b.debug[+qi],ans=(S.dbgans[id]||"").trim();
    if(!ans){toast("Write your answer first");return}
    const secs=Math.round((Date.now()-(S.dbgs[id]||Date.now()))/1000);
    if(t.dataset.dbgcopy){copy(dbgPrompt(b,c,ans,secs),$("#dbgcb-"+CSS.escape(id)));return}
    t.disabled=true;const box=$("#dbgfb-"+CSS.escape(id));box.innerHTML=`<div class="fb muted">Thinking…</div>`;
    try{const r=await sample.json(dbgPrompt(b,c,ans,secs)+"\n"+JSON_SHAPE);S.dbgfb[id]=Object.assign(normFb(r),{secs});save();box.innerHTML=renderScore(S.dbgfb[id]);const cl=document.querySelector(`[data-clock="${CSS.escape(id)}"]`);if(cl)cl.textContent=`Solved in ${fmt(secs)} (target ${fmt(c.target||120)})`;}
    catch(err){box.innerHTML=`<div class="fb">${esc(err&&err.message||"Couldn't grade this time.")} Open the solution checklist.</div>`}
    finally{t.disabled=false}return}
  if(t.dataset.ivcopy||t.dataset.ivcheck){const id=t.dataset.ivcopy||t.dataset.ivcheck,[bid,qi]=id.split(":"),b=blockById(bid),iv=b.interview[+qi],ans=(S.ivans[id]||"").trim();
    if(!ans){toast("Write your answer first");return}
    if(t.dataset.ivcopy){copy(ivPrompt(b,iv,ans),$("#ivcb-"+CSS.escape(id)));return}
    t.disabled=true;const box=$("#ivfb-"+CSS.escape(id));box.innerHTML=`<div class="fb muted">Thinking…</div>`;
    try{const r=await sample.json(ivPrompt(b,iv,ans)+"\n"+JSON_SHAPE);S.ivfb[id]=normFb(r);save();box.innerHTML=renderScore(S.ivfb[id]);}
    catch(err){box.innerHTML=`<div class="fb">Couldn't grade this time. Open “What a strong answer includes”.</div>`}
    finally{t.disabled=false}return}
  if(t.id==="guessgo"||t.id==="guessnone"){const v=t.id==="guessnone"?"":($("#guessin").value.trim());if(t.id==="guessgo"&&!v){toast("Write a guess, or press “I have no idea”");return}S.guess[S.cur]=v;save();render();return}
  if(t.id==="rcopy"||t.id==="rcheck"){const b=blockById(S.cur),txt=(S.recall[b.id]||"").trim();if(!txt){toast("Write your recall first");return}
    const strip=h=>String(h||"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
    const ref=`What the part covers: ${b.summary}\nKey points: ${b.watchFor.map(w=>w.replace(/[*`]/g,"")).join(" | ")}\nNotes: ${strip(b.explain).slice(0,2500)}`;
    if(t.id==="rcopy"){copy(`Grade my recall of a video part (I wrote it from memory). ${GRADE_RULES}\n\nVideo: "${D.title}", part "${b.title}" (${b.start}-${b.end})\nReference:\n${ref}\n\nMy recall:\n${txt}`,$("#rcb"));return}
    t.disabled=true;$("#rfb").innerHTML=`<div class="fb muted">Thinking…</div>`;
    try{const r=await sample.json(`A student watched one part of a programming video and wrote, from memory, what it covered. ${GRADE_RULES} Judge coverage of the key points and correctness, not English.\n${blockContext(b)}\nREFERENCE:\n${ref}\n\nSTUDENT RECALL:\n${txt}\n\n${JSON_SHAPE}`);
      S.rfb[b.id]=normFb(r);save();$("#rfb").innerHTML=renderScore(S.rfb[b.id]);}
    catch(err){$("#rfb").innerHTML=`<div class="fb">Couldn't grade this time. Try “Compare with the notes”.</div>`}
    finally{t.disabled=false}return}
  if(t.id==="cmp"){S.cmp[S.cur]=!S.cmp[S.cur];save();$("#cmpbox").hidden=!S.cmp[S.cur];t.textContent=S.cmp[S.cur]?"Hide":"Compare with the notes";return}
  if(t.dataset.pset){const [i,st]=t.dataset.pset.split(":");const b=blockById(S.cur);S.park[b.id][+i].status=st;save();$("#plist").innerHTML=parkItems(b,true);return}
  if(t.dataset.pcopy){const b=blockById(S.cur),p=S.park[b.id][+t.dataset.pcopy];copy(`I'm studying "${D.title}", part "${b.title}" (${b.start}-${b.end}). While watching I parked this question at ${fmt(p.at)} into the part: "${p.t}". Answer it briefly in simple English. If Casey covers it later in the series, just say so and give a one-line preview.`,$("#pans-"+t.dataset.pcopy));return}
  if(t.dataset.pask){const i=+t.dataset.pask,b=blockById(S.cur),p=S.park[b.id][i],out=$("#pans-"+i);t.disabled=true;out.textContent="Thinking…";
    try{const r=await sample(`You are a tutor for one part of a programming video. Answer the student's parked question in under 120 words, simple English. If it's about something Casey parks for later, say so in one line and give at most a one-sentence preview.\n${blockContext(b)}\n\nQUESTION (asked at ${fmt(p.at)} into the part): ${p.t}`,{onText:({text})=>{out.textContent=text}});p.ans=r.text;p.status="done";save();$("#plist").innerHTML=parkItems(b,true);}
    catch(err){out.textContent=err.text||"Couldn't answer this time. Try again later.";t.disabled=false}return}
  if(t.dataset.hint){$("#hint-"+CSS.escape(t.dataset.hint)).hidden=false;return}
  if(t.dataset.copyq){const [bid,qi]=t.dataset.copyq.split("?"),b=blockById(bid),q=b.questions[+qi];
    copy(`Check my answer. ${GRADE_RULES} Don't teach topics Casey hasn't covered yet.\n\nVideo: "${D.title}", part "${b.title}" (${b.start}-${b.end})\nQuestion: ${q.q}\nReference answer (don't show it to me unless I ask): ${q.a}\nMy answer: ${S.answers[t.dataset.copyq]||"(empty)"}`,$("#cb-"+CSS.escape(t.dataset.copyq)));return}
  if(t.dataset.check){checkAnswer(t.dataset.check,t);return}
  if(t.id==="flip"){revShow=true;render();return}
  if(t.dataset.rate){rateCard(revQueue.shift(),+t.dataset.rate);revShow=false;render();return}
  if(t.id==="chatgo"){chat();return}
  if(t.id==="chatclear"){S.notes[S.cur]=[];save();render();return}
  if(t.id==="anki"){const rows=allCards().map(x=>[x.c[0],x.c[1],(D.cardTag||"study")+"::"+x.b.id].map(s=>s.replace(/\t|\n/g," ")).join("\t")).join("\n");
    const name=(D.storageKey||"cards")+"-anki.tsv";
    if(downloads){try{await downloads.save({filename:name,data:rows});}catch(err){toast("Export was not saved")}}
    else{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([rows],{type:"text/tab-separated-values"}));a.download=name;a.click();}
    return}
});
$("#view").addEventListener("input",e=>{
  const a=e.target.dataset.ans; if(a){S.answers[a]=e.target.value;save()}
  const r=e.target.dataset.recall; if(r){S.recall[r]=e.target.value;save()}
  const v=e.target.dataset.iv; if(v){S.ivans[v]=e.target.value;save()}
  const g=e.target.dataset.dbg; if(g){S.dbgans[g]=e.target.value;save()}
});
async function checkAnswer(id,btn){
  const [bid,qi]=id.split("?"); const b=blockById(bid), q=b.questions[+qi]; const ans=(S.answers[id]||"").trim();
  const box=$("#fb-"+CSS.escape(id));
  if(!ans){box.innerHTML=`<div class="fb">Write an answer first, even a rough guess.</div>`;return}
  btn.disabled=true; box.innerHTML=`<div class="fb muted">Thinking…</div>`;
  const prompt=`You are a strict but encouraging tutor grading one answer from a student studying a programming video. The student's English is simple; use simple English.
${blockContext(b)}

QUESTION: ${q.q}
REFERENCE ANSWER: ${q.a}
STUDENT ANSWER: ${ans}

${GRADE_RULES} Grade understanding, not wording or English.
${JSON_SHAPE}`;
  try{const r=await sample.json(prompt);const fb=normFb(r);
    S.fb[id]=fb;save();box.innerHTML=renderScore(fb);}
  catch(err){box.innerHTML=`<div class="fb">${err&&err.code==="not_granted"?"Checking needs permission to use Claude. Open the model answer instead.":err&&err.code==="rate_limited"?"Too many checks at once. Try again in a minute.":esc(err&&err.message||"Couldn't check this time.")+" Try again, or open the model answer."}</div>`}
  finally{btn.disabled=false}
}
async function chat(){
  const b=blockById(S.cur); const inp=$("#chatin"); const text=inp.value.trim(); if(!text) return;
  const log=S.notes[b.id]=S.notes[b.id]||[]; log.push({r:"user",c:text}); inp.value=""; save(); render();
  const out=document.createElement("div"); out.className="msg a"; out.textContent="Thinking…"; $("#chatlog").append(out);
  const rules=`You tutor one student through this video part. Simple English. Stay inside the part's topic. If the question is about something Casey parks for later, say so in one line and give at most a one-sentence preview. Under 180 words.\n${blockContext(b)}`;
  try{const r=await sample([{role:"user",content:rules},...log.slice(-8).map(m=>({role:m.r,content:m.c}))],{cache:false,onText:({text})=>{out.textContent=text}});log.push({r:"assistant",c:r.text});save();}
  catch(err){out.textContent=err.text||"Couldn't answer this time. Try again."}
}
save(); render();
})();
</script>

</body></html>
