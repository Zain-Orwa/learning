/* ============ 12 ============ */
{id:"b12", lab:"none", title:"CPU Clock and Fetch Decode Execute", start:"21:14", end:"22:53",
summary:"Every processor uses the fetch, decode, execute cycle, and the computer's clock sets its pace. The 6502 was an 8-bit chip with a 1 MHz clock; the M1 is a 64-bit chip with a 3.2 GHz clock. Modern chips also use pipelining: several instructions are in different steps at the same time.",
focus:"Notice what the clock does to the cycle, and what pipelining changes.",
watchFor:[
 "At 21:13: the cycle is used in **every** processor, 6502 or M1.",
 "At 21:36: the **clock** regulates the pace of the cycle.",
 "At 21:46: 6502: **1 MHz**, so each step takes **one microsecond**.",
 "At 21:58: 6502 is **8-bit**: registers and ALU inputs and outputs are 8 bits wide.",
 "At 22:09: M1: **64-bit**, **3.2 GHz**, each step about **a third of a nanosecond**.",
 "At 22:24: **pipelining**: fetch, decode and execute of different instructions at the same time."
],
deferred:["Other optimizations in modern processors (22:43). Parts 17 and 18.","Instructions that need more than one cycle. Only mentioned in an on-screen note."],
oneLiner:"The clock ticks and each tick moves the cycle one step; a faster clock means shorter steps, and pipelining lets several instructions be in different steps at once.",
analogy:"Pipelining is a car wash with three stations. One car is rinsed while the next is soaped and a third is drying. Each car still passes all three, but a finished car comes out at every step.",
mistake:"Thinking pipelining makes one instruction faster. Each instruction still takes three steps; the gain is that a new one finishes every tick.",
guess:"What do you think tells the CPU when to move from fetch to decode to execute?",
explain:`<h3>The clock sets the pace</h3>
<div class="tbl"><table><thead><tr><th></th><th>6502</th><th>M1</th></tr></thead><tbody>
<tr><td>Clock</td><td>1 MHz: a million ticks a second</td><td>3.2 GHz: 3.2 billion ticks a second</td></tr>
<tr><td>Time for one step</td><td>1 microsecond</td><td>about a third of a nanosecond</td></tr>
<tr><td>Width</td><td>8-bit</td><td>64-bit</td></tr>
</tbody></table></div>
<p><b>8-bit</b> means the registers and the ALU's inputs and output are 8 bits wide. <b>64-bit</b> means they are 64 bits wide, so the M1 handles much larger numbers in one step.</p>
<h3>Pipelining</h3>
<p>Without it, one instruction finishes all three steps before the next starts: three ticks for each instruction. With pipelining, instructions are queued up. While instruction 1 is in decode, instruction 2 is already being fetched.</p>
<div class="tbl"><table><thead><tr><th></th><th>Tick 1</th><th>Tick 2</th><th>Tick 3</th><th>Tick 4</th><th>Tick 5</th></tr></thead><tbody>
<tr><td>Instruction 1</td><td>Fetch</td><td>Decode</td><td>Execute</td><td></td><td></td></tr>
<tr><td>Instruction 2</td><td></td><td>Fetch</td><td>Decode</td><td>Execute</td><td></td></tr>
<tr><td>Instruction 3</td><td></td><td></td><td>Fetch</td><td>Decode</td><td>Execute</td></tr>
</tbody></table></div>
<p>After the first two ticks, one instruction finishes on every tick. In the video's table, seven instructions finish in nine cycles.</p>
<div class="callout"><b>Honest note:</b> "one step per tick" is the video's simple model. Its on-screen note says some instructions take one cycle and others take several.</div>`,
check:{q:"What does the clock do in the fetch, decode, execute cycle, and what does pipelining add?",
 rubric:[["The clock sets the pace: each tick moves the cycle one step",35],["A faster clock means a shorter step: the 6502 at 1 MHz against the M1 at 3.2 GHz",25],["Pipelining: several instructions are in different steps at the same time",40]]},
practice:`<p>Work these out on paper:</p><ol><li>The 6502 ticks a million times a second. If each instruction needs three ticks, about how many instructions does it finish each second? Compare with the 430,000 calculations a second from Part 1.</li><li>In the video's pipeline table, 7 instructions finish in 9 cycles. How many cycles would 7 instructions need <b>without</b> pipelining?</li></ol>`,
experiment:`<p>Calculate instructions per second for the 6502, and the saving from pipelining.</p>`,
practiceMinutes:4,
reviewQuestion:"Two chips run the same cycle. One has a 1 MHz clock, the other 3.2 GHz and pipelining. Explain the two separate reasons the second finishes more instructions each second.",
questions:[
 {t:"21:46", q:"How long did each step of the cycle take on the 6502, and why?", a:"One microsecond, because its clock ticked a million times a second (1 MHz)."},
 {t:"22:24", q:"What is pipelining?", a:"A technique where several instructions are queued up, so fetch, decode and execute for different instructions are completed at the same time."}
],
cards:[
 ["What does the CPU **clock** do?","It regulates the pace of the fetch, decode, execute cycle."],
 ["6502 and M1: clock speed and bit width?","6502: 1 MHz, 8-bit. M1: 3.2 GHz, 64-bit."],
 ["What is **pipelining**?","Working on several instructions at once, each in a different step of the cycle."],

],

 {icon:"chip", label:"6502", text:"1 MHz and 8-bit: one microsecond for each step."},
 {icon:"chip", label:"M1", text:"3.2 GHz and 64-bit: about a third of a nanosecond for each step."},

],

analogy:"A heartbeat: from birth to death it repeats the same small motion, and everything else the body does depends on it.",
mistake:"Thinking the CPU rests when you do nothing. While the device is on, the cycle never stops.",
guess:"You guessed the shared principle in Part 2. Say it again in one sentence before you watch.",
explain:`<h3>The answer to Part 2</h3>
<p>The <b>fetch, decode, execute cycle</b> is the common piece of technological DNA. It has powered every processor built in the past 50 years: the 6502, the M1, a phone, a game console, a GPU, an AI server.</p>
<p>Three things keep it going:</p>
<ol><li><b>Programs</b> filled with instructions and data (the book).</li>
<li>The <b>cycle</b> itself: fetch, decode, execute, again and again.</li>
<li>The <b>clock</b>, which regulates the pace.</li></ol>
<h3>Why it is so powerful</h3>
<p>The hardware stays the same; only the book changes. One chip can run a game, a browser or a compiler, because each is just a different list of the same simple instructions. That flexibility is the point, and the next part shows chips that give it up.</p>
<div class="callout"><b>Link to the course:</b> in Intro to C Day 1, Windows loads your .exe and "starts the CPU at the entry point". Now you can say exactly what that means: it puts the entry address in the program counter, and the cycle does the rest.</div>`,

 rubric:[["The fetch, decode, execute cycle",50],["It repeats without stopping from power on to power off, over programs of instructions and data",30],["The clock regulates its pace",20]]},

],

{id:"b14", lab:"none", title:"ASICs and FPGAs", start:"23:47", end:"24:35",
summary:"There are chips that do not use the cycle. ASICs (for example in a Bitcoin miner) and FPGAs (in car computers and cameras) skip fetch and decode: data flows through a set pattern of logic gates. They are highly optimized but very inflexible. Quantum computers are further away still.",
focus:"Notice which steps ASICs and FPGAs leave out, and what they gain and lose.",
watchFor:[
 "At 23:44: **ASIC** = application-specific integrated circuit, shown in a Bitcoin mining computer.",
 "At 24:00: **FPGA** = field-programmable gate array, in car computers and cameras.",
 "At 24:09: they do **not** use the fetch and decode steps.",
 "At 24:21: highly **optimized** but very **inflexible**.",
 "At 24:25: quantum computers use qubits and quantum circuits."
],
deferred:["Quantum computers (24:25). The video leaves them for future videos.","How an FPGA is reprogrammed. Not in this video."],
oneLiner:"ASICs and FPGAs skip fetch and decode and push data through a fixed pattern of logic gates, which makes them very fast at one job and unable to do others.",
analogy:"A CPU is a cook who can follow any recipe. An ASIC is a machine that only makes one kind of biscuit, much faster than the cook, and nothing else.",
mistake:"Thinking every chip is a small CPU. Many chips have no program counter and no instructions at all.",
guess:"If a chip only ever does one job, which steps of fetch, decode, execute could it leave out?",
explain:`<h3>What the video says</h3>
<ul><li><b>ASIC</b>: application-specific integrated circuit. Example: the chips in a Bitcoin mining computer.</li>
<li><b>FPGA</b>: field-programmable gate array. Example: the main chips in some car computers and cameras.</li>
<li>Neither uses the <b>fetch</b> and <b>decode</b> steps. They do repetitive operations by flowing data through a set pattern of logic gates and execution units.</li>
<li>Result: highly optimized, but very inflexible.</li>
<li>Even further away are <b>quantum computers</b>, based on qubits and quantum circuits.</li></ul>
<h3>The trade</h3>
<div class="tbl"><table><thead><tr><th></th><th>CPU</th><th>ASIC / FPGA</th></tr></thead><tbody>
<tr><td>What decides the work</td><td>The program (the book)</td><td>The wiring of the gates</td></tr>
<tr><td>Fetch and decode</td><td>Yes, for every instruction</td><td>No</td></tr>
<tr><td>Strength</td><td>Can run any program</td><td>Very fast and efficient at one job</td></tr>
<tr><td>Weakness</td><td>Spends time fetching and decoding</td><td>Cannot do other jobs</td></tr>
</tbody></table></div>
<p><b>Going a little deeper:</b> the video groups the two together. One difference is in the names. An ASIC's pattern is fixed when it is made. An FPGA is "field-programmable": its pattern of gates can be set up again later. Once it is set up, though, data flows through it in the same way, with no instructions being fetched.</p>`,
check:{q:"How do ASICs and FPGAs work differently from a CPU, and what is the trade-off?",
 rubric:[["They do not fetch and decode instructions: data flows through a set pattern of logic gates",50],["This makes them highly optimized for their one job",25],["They are inflexible: they cannot run any program like a CPU can",25]]},
practice:`<p>For each job, write <b>CPU</b> or <b>ASIC/FPGA</b> and one reason:</p><ol><li>Running a web browser, a game and a compiler on the same machine.</li><li>Doing the same Bitcoin calculation billions of times.</li><li>Processing every frame from a camera sensor in the same way.</li></ol>`,

],

oneLiner:"Memory brings the needed data to the CPU and writeback saves results, and because these are slower and not always needed, some descriptions count them in the cycle and some do not.",
analogy:"Cooking a step takes a second, but sometimes you must first walk to the store room for an ingredient, and afterwards put things away. Those walks are memory and writeback.",
mistake:"Thinking every instruction takes the same time. An instruction that needs a book from the shelves takes far longer than one that only uses the paper.",
guess:"After fetch, decode and execute, what else might an instruction still need to do?",
explain:`<h3>What the video says</h3>
<ul><li><b>Memory</b>: like moving books from the SSD shelves onto the DRAM cart, and then onto the table (cache).</li>
<li><b>Writeback</b>: like writing data into the books. When the table needs room for a new book, the old one goes back on the cart and later to the shelves.</li>
<li>Both use another special location, the <b>memory address register</b>. On screen it holds a bookshelf number, a row and a book number.</li>
<li>They usually take much longer than fetch, decode and execute. So in some architectures and textbooks they are part of the cycle, and in others they are not.</li></ul>
<h3>The five-step version</h3>
<p>Fetch → Decode → Execute → Memory → Writeback.</p>
<p><b>Going a little deeper:</b> in many textbooks the five steps are defined a bit more narrowly. There, <i>memory</i> is the step where a load or store instruction reads or writes its data address, and <i>writeback</i> is the step where the result is written into a register. The video uses the book-moving picture instead, and its on-screen note says memory and writeback are more complicated and will get their own video.</p>
<div class="callout"><b>Link to Part 7:</b> load and store are the instructions that need the memory step. Add and compare, which use only registers, do not.</div>`,

],

{id:"b16", lab:"none", title:"RISC vs CISC", start:"28:02", end:"30:09",
summary:"The M1's 354 instructions are called ARMv8.4, a RISC design (reduced instruction set computer). Intel and AMD chips use CISC (complex instruction set computer), with thousands of possible instructions. The same Snake game compiles to 676 instructions on ARM and 560 on x86-64.",
focus:"Notice which chips are RISC and which are CISC, and how the same program turns out differently for each.",
watchFor:[
 "At 28:08: the M1's set is **ARMv8.4**, a **RISC** architecture.",
 "At 28:19: Snake: 145 lines of C++ become **676** assembly instructions for ARM.",
 "At 28:48: Intel and AMD chips use **CISC**, with thousands of possible instructions.",
 "At 29:06: the same Snake on **x86-64**: only **560** instructions.",
 "At 29:17: RISC instructions are simple and run at a steady fast rate; RISC is more energy efficient.",
 "At 29:37: CISC packs more into one instruction; its decoder is much more complicated."
],
deferred:["More pros and cons of RISC and CISC (29:57). The video saves them for another video.","How a compiler chooses instructions. Intro to C Day 1 Part 3, and the assembly from Day 2."],
oneLiner:"RISC (ARM, the M1) uses a few hundred simple instructions that run at a steady rate, while CISC (x86-64, Intel and AMD) uses thousands of instructions that each do more.",
analogy:"RISC is a box of plain building bricks: you need more of them, but each is simple. CISC adds many special pieces: fewer are needed, but each one is harder to make and to fit.",
mistake:"Thinking fewer instructions in the program means a faster program. CISC's 560 instructions each do more, and some take several clock cycles.",
guess:"The same game is compiled for two chip families. Do you expect the same number of instructions in both? Why?",
explain:`<h3>What the video says</h3>
<div class="tbl"><table><thead><tr><th></th><th>RISC</th><th>CISC</th></tr></thead><tbody>
<tr><td>Stands for</td><td>Reduced instruction set computer</td><td>Complex instruction set computer</td></tr>
<tr><td>Example</td><td>ARMv8.4: the M1, all smartphones</td><td>x86-64: Intel and AMD chips</td></tr>
<tr><td>Number of instructions</td><td>354 on the M1</td><td>Thousands</td></tr>
<tr><td>Each instruction</td><td>Small and simple</td><td>Large and complex, does more</td></tr>
<tr><td>Time for one instruction</td><td>Steady: one clock cycle</td><td>Varies: sometimes two or more cycles</td></tr>
<tr><td>Decoder</td><td>Simpler; fixed format</td><td>Much more complicated; variable format</td></tr>
<tr><td>Energy</td><td>More efficient</td><td>Not the focus</td></tr>
<tr><td>Snake (145 lines of C++)</td><td>676 instructions</td><td>560 instructions</td></tr>
</tbody></table></div>
<h3>The compiler's job</h3>
<p>A <b>compiler</b> is a separate piece of software. It takes the C++ code together with the chip's instruction set and produces the list of instructions, the same ones found in the "book", here a program named <code>snake.app</code>.</p>
<h3>Why RISC needs more instructions</h3>
<p>A RISC instruction does one small thing. A CISC instruction can combine several small things, for example reading from memory and adding in one instruction. So the same program needs fewer CISC instructions, but each can take longer and is harder to decode.</p>
<div class="callout"><b>Link to the course:</b> this is Intro to C Day 1 Part 3 again: "the same C becomes different bytes for x64 and for ARM". Your Windows PC is x86-64 (CISC). This Mac is ARM (RISC). The Code Lab shows x64 instructions because the course targets Windows.</div>`,

],

/* ============ 17 ============ */
{id:"b17", lab:"none", title:"Extrapolating to the M1", start:"31:09", end:"33:36",
summary:"The simple analogy is very close to a real Apple IIe: floppy drives are the shelves, DRAM chips are the cart, and the 6502 die holds the decoder, ALU, program counter and registers. It has no cache. For the M1 the table must become much bigger, with areas for each core, and one performance core adds caches, a pipeline and a branch predictor.",
focus:"Notice why the 6502 needs no cache, and what one M1 performance core adds.",
watchFor:[
 "At 31:25: the analogy is close to the **Apple IIe**: floppy drives = shelves, DRAM chips = cart.",
 "At 31:41: inside the 6502: instruction decoder, ALU, program counter, current instruction register.",
 "At 32:24: **no cache** in the 6502: DRAM in the 80s was as fast as the instructions.",
 "At 32:51: for the M1 the table gets much bigger, with areas for each core and the GPU.",
 "At 33:16: one performance core: separate **64 KB** data and instruction caches.",
 "At 33:22: a **pipeline** queues eight instructions each clock cycle, and a **branch predictor** helps it."
],
deferred:["The other blocks of the performance core. That is the next part.","How a branch predictor guesses. Only named here."],
oneLiner:"The 6502 really is the simple analogy with no cache, and an M1 performance core is the same idea made much bigger, with caches, a wide pipeline and a branch predictor added.",
analogy:"The 6502 is one cook at a small table. The M1 is a large kitchen with several cooks, each with a bigger table, their own shelf of ingredients within reach, and a helper who guesses the next order.",
mistake:"Thinking the M1 works on a different principle. It still fetches, decodes and executes; it just does many at once and keeps data closer.",
guess:"Why might a chip from the 1980s work fine without any cache memory?",
explain:`<h3>The analogy is a real 6502</h3>
<ul><li><b>Floppy drives</b> = the bookshelves. <b>DRAM chips</b> = the cart.</li>
<li>The 6502 die has the <b>instruction decoder</b>, the <b>ALU</b>, the <b>program counter</b>, the <b>current instruction register</b> and the other registers.</li>
<li>The video points out where the PC fetches an instruction, where instructions and data are bussed in and out to the DRAM, and where the decoder makes the control signals.</li></ul>
<h3>Why no cache?</h3>
<p>On screen: the 6502's clock step is about <b>980 ns</b> and DRAM access took <b>150 to 200 ns</b>. The memory answered faster than the CPU could take a step, so a closer, faster copy was not needed. The table in the analogy is even smaller: no open book on it.</p>
<p>Today it is the other way round. The M1 takes a step in about a third of a nanosecond, far faster than DRAM. So it keeps a small, very fast copy of what it needs right on the die: the cache.</p>
<h3>Scaling up to the M1</h3>
<ol><li>Make the table much bigger.</li>
<li>Mark off areas for each performance core, each efficiency core, the GPU and other parts.</li>
<li>Inside one performance core:
 <ul><li>Separate <b>64 KB caches</b> for data and for instructions.</li>
 <li>A <b>pipeline</b> that queues eight instructions for each clock cycle.</li>
 <li>A <b>branch predictor</b>, to reduce problems with conditional branches and keep the pipeline flowing.</li></ul></li></ol>
<h3>Why a branch predictor?</h3>
<p>Remember Part 9: a conditional branch decides where the program goes only when it executes. But a pipeline has already started fetching the next instructions. Which ones? The predictor guesses the direction, so the pipeline does not have to wait.</p>`,
check:{q:"Why did the 6502 need no cache? And what do the caches, the pipeline and the branch predictor add in an M1 performance core?",
 rubric:[["The 6502's memory (DRAM) was as fast as its steps, so no closer copy was needed",34],["The M1 core has its own instruction and data caches, and a pipeline that works on several instructions each cycle",33],["The branch predictor guesses which way a branch goes so the pipeline does not have to wait",33]]},
practice:`<p>The video's diagram says each cache is 64 KB. Ask this Mac for its own numbers in Terminal:</p><pre><code>sysctl hw.perflevel0.l1icachesize hw.perflevel0.l1dcachesize</code></pre><p>The answers are in bytes. Divide by 1024 to get KB and write both next to the video's 64. Are they the same? (The video itself says its diagrams are approximations.)</p>`,
experiment:`<p>Read this Mac's real cache sizes and compare them with the diagram in the video.</p>`,
practiceMinutes:4,
reviewQuestion:"A pipeline has already fetched the next instructions when it reaches a conditional branch. What problem does that cause, and which part of the M1 core deals with it?",
questions:[
 {t:"32:24", q:"Why is there no cache in the 6502?", a:"The DRAM chips in the 80s were just as fast as the instructions, so the table in the analogy is even smaller."},
 {t:"33:22", q:"What does the branch predictor do?", a:"It reduces issues with conditional branching and helps the pipeline run smoothly."}
],

 ["Why did the 6502 have no cache?","Its memory was as fast as the CPU's own steps, so nothing closer was needed."],

],

{id:"b18", lab:"none", title:"The Diagram of a Performance Core", start:"33:36", end:"34:09",
summary:"The core diagram matches the analogy block by block: a pipelined instruction decoder, 32 general-purpose registers, the calculator split into eight smaller calculators that each handle a few functions, and a special section for load and store instructions.",

],
deferred:["Rename and reorder buffer, dispatch, port queues. They are on the diagram but the video does not explain them.","The GPU's architecture. Part 20."],
oneLiner:"In an M1 performance core the paper has 32 registers, the one calculator is eight smaller specialised ones, the decoder works on several instructions at once and loads and stores have their own section.",
analogy:"One cook with one knife has become a line of eight specialists: one chops, one fries, one bakes. Several steps of the recipe can be done at the same moment.",
mistake:"Thinking eight calculators means eight cores. All eight are inside one core, working on different instructions of the same program.",
guess:"If a core works on many instructions at once, what must happen to its one calculator?",
explain:`<h3>The diagram against the analogy</h3>
<div class="tbl"><table><thead><tr><th>Analogy (and the 6502)</th><th>M1 performance core</th></tr></thead><tbody>
<tr><td>The robot reads one instruction</td><td>Instruction fetch feeds a <b>pipelined decoder</b>: four decoders side by side, then a decode queue</td></tr>
<tr><td>Sheet of paper with 4 registers</td><td><b>32</b> general-purpose registers</td></tr>
<tr><td>One calculator (ALU)</td><td><b>Eight</b> smaller calculators, each handling a few functions: branch, ALU, multiply and divide, and others</td></tr>
<tr><td>Load and store done by the robot</td><td>A <b>special section</b> for load and store: load buffer, store buffer, load store unit</td></tr>
<tr><td>One open book</td><td>Separate L1 instruction cache and L1 data cache</td></tr>
</tbody></table></div>
<h3>Why split the calculator?</h3>
<p>The pipeline brings in several instructions each cycle. One calculator could do only one of them at a time. Eight smaller ones can each take a different instruction in the same cycle: one adds, one compares for a branch, one multiplies.</p>
<p>The video adds that this is the layout of a single core. The graphics processor and the neural processor on the same chip have entirely different architectures.</p>
<div class="callout"><b>You can now read the diagram from Part 2.</b> Bottom to top it is the cycle: fetch → decode → registers → execute units → load and store → cache.</div>`,

guess:"Besides CPU cores, what else do you think is built into the M1 chip?",
explain:`<h3>What the video says</h3>
<p>On screen the M1 is added up like this:</p>
<p><b>Processing cores + GPU + NPU + hardware accelerators + I/O + NoC + security + other = M1 SoC</b></p>
<ul><li>Three types of processor: the CPU's <b>processing cores</b>, the <b>GPU</b> (graphics) and the <b>NPU</b> (neural processing unit).</li>
<li><b>Hardware accelerators</b>, such as the media engine.</li>
<li>So the M1 is closer to a <b>system on a chip</b> than a traditional CPU.</li>
<li>All the processors in these devices, including the CPU in a desktop computer, can be considered SoCs. The difference is more a marketing term than a technical one.</li></ul>
<h3>A note about trust</h3>
<p>The M1 and all modern processors are proprietary designs. The diagrams in the video are close approximations, built with input from industry experts. This is why a number on a diagram may differ from what your own Mac reports (Part 17).</p>

/* ============ 20 ============ */
{id:"b20", lab:"none", title:"GPU Architecture", start:"34:58", end:"35:55",
summary:"In the analogy, one GPU core (a CUDA core) is about as complex as a whole 6502. A GPU chip has 10,000 to 20,000 of them. GPUs use 32-bit ALUs and work in a way called SIMT: one instruction is fetched and decoded once, then sent to a batch of cores that each execute it on different data.",
focus:"Notice what one GPU core is compared to, and what is shared and what is different in SIMT.",
watchFor:[
 "At 35:04: a GPU **CUDA core** is about as complex as the **6502**.",
 "At 35:11: **10,000 to 20,000** CUDA cores in one GPU chip.",
 "At 35:21: GPUs typically use **32-bit** ALU calculators.",
 "At 35:25: **SIMT**: single instruction, multiple thread.",
 "At 35:38: the cores execute the same instruction with **different addresses and data**."
],
deferred:["The details of SIMT and GPU architecture (35:43). The video points to its separate video on how graphics cards work."],
oneLiner:"A GPU is thousands of simple cores, each about as complex as a 6502, that all execute the same fetched and decoded instruction on different data.",
analogy:"A hall with ten thousand desks, each with a small calculator. One announcer reads out a single step, and every desk does that step on its own numbers.",
mistake:"Thinking a GPU is a faster CPU. Each GPU core is simple; the power comes from thousands doing the same step at once.",
guess:"A GPU must do the same maths on millions of pixels. How might it be organised differently from a CPU?",
explain:`<h3>What the video says</h3>
<ul><li>One GPU <b>CUDA core</b> is very similar in complexity to the architecture of the 6502.</li>
<li>A single GPU chip has <b>10,000 to 20,000</b> CUDA cores: like a massive array of 6502 cores.</li>
<li>GPUs typically use <b>32-bit</b> ALU calculators.</li>
<li>They perform <b>SIMT</b>: single instruction, multiple thread. One instruction is fetched and decoded, then distributed to a batch of cores. Those cores execute it using different addresses and data.</li></ul>
<h3>CPU against GPU, in the terms of this video</h3>
<div class="tbl"><table><thead><tr><th></th><th>CPU core (M1 performance core)</th><th>GPU</th></tr></thead><tbody>
<tr><td>Cores</td><td>A few, each very complex</td><td>Thousands, each simple</td></tr>
<tr><td>Fetch and decode</td><td>Each core does its own</td><td>Done once, shared by a batch of cores</td></tr>
<tr><td>Execute</td><td>Different instructions at once</td><td>The same instruction on different data</td></tr>
<tr><td>Good at</td><td>Programs full of decisions</td><td>The same calculation repeated on many values</td></tr>
</tbody></table></div>

/* ---------- helpers ---------- */
const blockById=id=>D.blocks.find(b=>b.id===id);
const idxOf=b=>D.blocks.indexOf(b);
/* ---------- guesses: the part's main guess plus the key questions listed in b.pre ---------- */
function migrate(){
  S.guesses=S.guesses||{};S.lb=S.lb||{};S.lbShow=S.lbShow||{};
  S.checkAnswers=S.checkAnswers||{};S.checkFb=S.checkFb||{};S.practice=S.practice||{};S.practiceDone=S.practiceDone||{};
  S.checkAttempts=S.checkAttempts||{};S.reviewChecks=S.reviewChecks||{};
  // Preserve a prior short check as an attempt; old Recall grades are history only.
  Object.entries(S.checkFb).forEach(([id,fb])=>{if(!S.checkAttempts[id]&&Number.isFinite(fb.score))S.checkAttempts[id]=[{answer:S.checkAnswers[id]||"",fb}];});
  Object.keys(S.guess||{}).forEach(id=>{if(!S.guesses[id])S.guesses[id]=[S.guess[id]]});
  if(!["watch","recall","experiment"].includes(S.step)){
    const d=S.done[S.cur]||{};
    S.step=d.watch?(d.recall?"experiment":"recall"):"watch";
  }
  S.v=4;
}
function stepsFor(b){return STEPS.filter(([k])=>k!=="experiment"||b.practice||b.experiment)}
function blockDone(b){const d=S.done[b.id]||{};return stepsFor(b).filter(([k])=>d[k]).length}
function frontier(){const i=D.blocks.findIndex(b=>!S.completed[b.id]);return i===-1?D.blocks.length:i}
const allDone=()=>frontier()>=D.blocks.length;
const unlocked=b=>idxOf(b)<=frontier();
function stepOpen(b,k){const st=stepsFor(b),i=st.findIndex(([x])=>x===k),d=S.done[b.id]||{};return i>=0&&(d[k]||st.slice(0,i).every(([x])=>d[x]))}
function allCards(){const out=[];D.blocks.forEach(b=>(b.cards||[]).forEach((c,i)=>out.push({id:b.id+"#"+i,b,c})));return out}
function progress(){let tot=0,dn=0;D.blocks.forEach(b=>{tot+=stepsFor(b).length;dn+=blockDone(b)});return tot?Math.round(dn*100/tot):0}
function checkFor(b){return b.check||{q:b.questions[0].q,rubric:[[b.questions[0].a,100]]};}
function rubricText(rubric){return rubric.map(([idea,weight],i)=>`${i+1}. ${idea} (${weight}%)`).join("\n");}
function rubricHTML(rubric){return `<details class="model"><summary>What this check expects</summary><ul>${rubric.map(([idea,weight])=>`<li>${md(idea)} (${weight}%)</li>`).join("")}</ul></details>`;}
function checkPrompt(b,check,answer,attempt=1){return `Check a short answer to this question only. ${GRADE_RULES}\nATTEMPT: ${attempt} of 2. ${attempt===2?"If below 80%, explain the main gap directly. Do not ask another question.":"At most one retry; never ask for perfect wording."}\nPART: ${b.title}\nQUESTION: ${check.q}\nFIXED CHECKLIST:\n${rubricText(check.rubric)}\nANSWER: ${answer}\n${JSON_SHAPE}`;}
function attemptsFor(id){return S.checkAttempts[id]||(S.checkAttempts[id]=[]);}
function checkClosed(attempts){return attempts.length>=2||attempts.some(a=>a.fb.score>=80);}
const checking=new Set();
async function gradeAttempt(key,attempts,b,check,answer,isCurrent){
  answer=answer.trim();
  if(!answer||checkClosed(attempts)||checking.has(key))return false;
  if(attempts.some(a=>a.answer===answer)){toast("Change your answer for the retry, or continue.");return false;}
  checking.add(key);
  try{
    const fb=normFb(await sample.json(checkPrompt(b,check,answer,attempts.length+1)),check.rubric);
    // Edits made during a request must not inherit that request's score or use a retry.
    if(!isCurrent()||checkClosed(attempts))return false;
    attempts.push({answer,fb});save();return true;
  }finally{checking.delete(key);}
}
function checkFeedback(attempts,review=false){
  if(!attempts.length)return "";
  const fb=attempts[attempts.length-1].fb;
  if(fb.score>=80)return renderScore(fb)+`<p class="small">Check passed. ${review?"Save this review":"Continue to practice"}; no rewording needed.</p>`;
  if(attempts.length<2)return renderScore(fb)+`<p class="small">One retry is available, or continue with the correction.</p>`;
  const gap=[...(fb.missing||[])].sort((a,b)=>b.pct-a.pct)[0];
  return renderScore({...fb,missing:[],guide:""})+`<p><b>The key idea:</b> ${esc(gap?gap.point:fb.guide||"Read the checklist for the core idea.")}</p><p class="small">${review?"Save this review with your first score.":"Continue to practice."} Check this again in a later review.</p>`;
}
function checked(b){return !!(S.checkFb[b.id]&&S.checkFb[b.id].score>=80&&S.practiceDone[b.id]&&(S.practice[b.id]||"").trim());}
function pendingPractice(){return D.blocks.filter(b=>S.completed[b.id]&&(S.practice[b.id]||"").trim()&&!S.practiceDone[b.id]);}
function pendingHTML(){
  const pending=pendingPractice();if(!pending.length)return "";
  return `<details class="plan"><summary>${pending.length} practical task${pending.length===1?"":"s"} still to try</summary><p class="small">${esc(PENDING_NOTE)}</p><ul>${pending.map(b=>`<li><button class="btn ghost small" data-practicepart="${b.id}">Part ${idxOf(b)+1}: ${esc(b.title)}</button> ${esc(S.practice[b.id])}</li>`).join("")}</ul></details>`;
}
function blockContext(b){
  const strip=h=>String(h||"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
  return `VIDEO: "${D.title}"${D.eyebrow?" ("+D.eyebrow+")":""}.
PART: ${b.title} (${b.start}-${b.end})
WHAT ${TEACHER.toUpperCase()} COVERS: ${b.summary}
STUDY NOTES: ${strip(b.explain).slice(0,3500)}
TOPICS ${TEACHER.toUpperCase()} PARKS FOR LATER (do not teach these; say they come later): ${(D.parked||[]).map(p=>p.what+" ["+p.where+"]").join("; ")}`;
}

const vid=vw.querySelector("video");
const range=b=>[secs(b.start),secs(b.end)];
function ptick(){
  const b=playerBlock; if(!b||!vid.duration) return;

  if(vid.currentTime<st-0.4){vid.currentTime=st}
  if(vid.currentTime>=en-0.05){ if(!vid.paused) vid.pause(); if(Math.abs(vid.currentTime-en)>0.2) vid.currentTime=en; partEnded(); }
  const t=Math.min(Math.max(vid.currentTime,st),en);
  vw.querySelector(".pbar i").style.width=((t-st)/(en-st)*100)+"%";
  vw.querySelector(".pbar").setAttribute("aria-valuenow",String(Math.round((t-st)/(en-st)*100)));
  vw.querySelector(".ptime").textContent=fmt(t-st)+" / "+fmt(en-st);
  const pb=vw.querySelector('[data-v="play"]'), st2=vid.paused?"play":"pause"; if(pb.dataset.icon!==st2){pb.dataset.icon=st2;pb.innerHTML=ICON[st2];pb.setAttribute("aria-label",vid.paused?"Play":"Pause");pb.title=vid.paused?"Play (Space)":"Pause (Space)";}
  if(Date.now()-lastSave>3000){lastSave=Date.now();S.vt[b.id]=t;save();}
}
(function loop(){ if(!vid.paused) ptick(); requestAnimationFrame(loop); })();
vid.addEventListener("timeupdate",ptick); vid.addEventListener("pause",ptick); vid.addEventListener("play",()=>{vw.querySelector(".pend").hidden=true;ptick()});
vid.addEventListener("seeking",()=>{const b=playerBlock;if(!b)return;const [st,en]=range(b);if(vid.currentTime<st)vid.currentTime=st;if(vid.currentTime>en)vid.currentTime=en;});
vid.addEventListener("loadedmetadata",()=>{seekResume();ptick();});
function seekResume(){const b=playerBlock;if(!b||!vid.duration)return;const [st,en]=range(b);let t=S.vt[b.id];if(!(t>=st&&t<en-1))t=st;vid.currentTime=t;vid.playbackRate=S.speed||1;vw.querySelector('[data-v="speed"]').textContent=(S.speed||1)+"×";}
function partEnded(){
  const b=playerBlock; if(!b) return;
  vw.querySelector(".pend").hidden=false; S.vt[b.id]=range(b)[1];
  const d=(S.done[b.id]=S.done[b.id]||{}); if(!d.watch){d.watch=true;save();const st=$(".steps [data-step='watch']");if(st)st.classList.add("done");const nb=$("#markNext");if(nb)nb.textContent="Next step →";}
}
vw.addEventListener("click",e=>{
  const t=e.target.closest("[data-v]"); const b=playerBlock;
  if(t&&b){const [st,en]=range(b),v=t.dataset.v;
    if(v==="play"){ if(vid.paused){ if(vid.currentTime>=en-0.1) vid.currentTime=st; vid.play().catch(()=>{}); } else vid.pause(); }
    if(v==="back"){vid.currentTime=Math.max(st,vid.currentTime-10)}

    if(v==="fs"){ if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); else vw.requestFullscreen?.().catch(()=>toast("Full screen isn't available here")); }
    if(v==="next"){ if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); goNextStep(); }
    ptick(); return;}
  const bar=e.target.closest(".pbar"); if(bar&&b){const r=bar.getBoundingClientRect(),[st,en]=range(b);vid.currentTime=st+(en-st)*Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));ptick();}
});

/* ---------- listen: read the Explain / Read code step aloud ----------
   Kokoro only: tools/voice/make_audio.py renders each piece of text and build.py puts the map into
   D.audio = {blockId: {step: {text: "audio/file.mp3"}}}. The browser's own voice is never used: a piece
   with no mp3 (or a file that fails to load) is skipped. */
const AUD=D.audio||{}, AU=new Audio();
let referenceStep=S.lessonViews?.[S.cur]||"explain";
let tts={segs:[],i:0,on:false,gen:0};
const stepAudio=()=>(AUD[S.cur]||{})[referenceStep||S.step]||null;
const ttsHint=()=>"Natural voice. Code is read as the “In words” version.";
function listenBar(){
  if(!stepAudio()) return `<p class="small muted">Read the notes below.</p>`;
  return `<div class="listen"><button class="btn small" data-tts="play" id="ttsplay">${ICON.speak}<span>Listen</span></button>
  <button class="btn ghost small" data-tts="stop" id="ttsstop" aria-label="Stop" title="Stop" hidden>${ICON.stop}</button>
  <button class="btn ghost small" data-tts="rate" aria-label="Reading speed" title="Reading speed">${S.ttsRate||1}×</button>
  <span class="small muted" id="ttsinfo">${ttsHint()}</span></div>`;
}
function inWords(s){
  if(Array.isArray(s)||typeof s==="string"){ // old format: a plain list of lines
    const lines=Array.isArray(s)?s:String(s).split("\n");
    return `<div class="inwords"><div class="k">In words</div><ol>${lines.map(l=>`<li class="ln">${md(l)}</li>`).join("")}</ol></div>`;
  }
  return `<div class="inwords"><div class="k">In words</div>`
    +(s.goal?`<p class="ln iw"><b>Goal:</b> ${md(s.goal)}</p>`:"")
    +`<ol>${(s.steps||[]).map((l,i)=>`<li class="ln"><span class="vh">Step ${i+1}. </span>${md(l)}</li>`).join("")}</ol>`
    +(s.pattern?`<p class="ln iw"><b>Pattern:</b> ${md(s.pattern)}</p>`:"")
    +(s.tryit?`<p class="ln iw try"><b>Try it in your head:</b> ${md(s.tryit)}</p>`:"")+`</div>`;
}
function withWords(html,say){
  if(!say||!say.length) return html;
  let n=0;
  return html.replace(/<\/pre>|<\/table>/g,m=>{const s=say[n++]; return s?m+inWords(s):m;});
}
function ttsSegments(){ // the pieces that have a Kokoro mp3, in reading order (pieces without one are skipped)
  const pane=$("#study-dialog")?.open?$("#dialog-body"):$("#pane"); if(!pane) return [];
  const map=stepAudio()||{};
  const els=[...pane.querySelectorAll("h3,p,li,.callout,.inwords .ln")].filter(el=>!el.closest("pre,table,.listen,details"));
  return els.filter(el=>!els.some(o=>o!==el&&o.contains(el))).map(el=>{const key=el.textContent.replace(/\s+/g," ").trim();
    return {el,file:map[key]||null};}).filter(x=>x.file);
}
function ttsSpeak(resume){
  const seg=tts.segs[tts.i]; if(!seg){ttsStop(true);return}
  document.querySelectorAll(".reading").forEach(e=>e.classList.remove("reading"));
  seg.el.classList.add("reading");
  const r=seg.el.getBoundingClientRect(); if(r.top<0||r.bottom>innerHeight) seg.el.scrollIntoView({block:"center",behavior:"smooth"});
  const info=$("#ttsinfo"); if(info) info.textContent=`${tts.i+1} / ${tts.segs.length}`;
  const g=tts.gen; let over=false;
  const next=()=>{if(over||g!==tts.gen)return; over=true; tts.i++; ttsSpeak();}; // a file that fails is skipped too
  if(!(resume&&AU.src===new URL(seg.file,location.href).href)) AU.src=seg.file;
  AU.playbackRate=S.ttsRate||1; AU.onended=next; AU.onerror=next;
  AU.play().catch(e=>{ if(e.name==="NotAllowedError"){if(g===tts.gen){tts.on=false;ttsUi();}return} next(); });
}
function ttsUi(finished){
  const p=$("#ttsplay"),s=$("#ttsstop"),i=$("#ttsinfo"); if(!p) return;
  p.innerHTML=tts.on?ICON.pause+"<span>Pause</span>":ICON.speak+"<span>"+(tts.segs.length&&tts.i>0?"Resume":"Listen")+"</span>";
  s.hidden=!(tts.on||tts.i>0);
  if(i&&!tts.on&&!tts.segs.length) i.textContent=finished?"Done. Press Listen to hear it again.":ttsHint();
}
function ttsHush(){ tts.gen++; AU.pause(); }
function ttsStop(finished){
  ttsHush(); AU.removeAttribute("src");
  tts={segs:[],i:0,on:false,gen:tts.gen};
  document.querySelectorAll(".reading").forEach(e=>e.classList.remove("reading"));
  ttsUi(finished);
}
function ttsCmd(c){
  if(!stepAudio()) return;
  if(c==="rate"){const r=[1,1.25,1.5,0.75];S.ttsRate=r[(r.indexOf(S.ttsRate||1)+1)%r.length];save();
    const b=document.querySelector('[data-tts="rate"]'); if(b) b.textContent=S.ttsRate+"×";
    AU.playbackRate=S.ttsRate; return;} // the mp3 changes speed in place
  if(c==="stop"){ttsStop();return}
  if(tts.on){ttsHush();tts.on=false;ttsUi();return} // pause: keeps the place (an mp3 resumes mid-sentence)
  let resume=true;
  if(!tts.segs.length||tts.i>=tts.segs.length){tts.segs=ttsSegments();tts.i=0;resume=false;}
  if(!tts.segs.length){toast("Nothing to read here");return}
  ivStop(); tts.on=true; ttsUi(); ttsSpeak(resume);
}

/* ---------- mic: speak instead of typing, in EVERY text box ----------
   attachMics() wraps each <textarea> and text <input> (watched by a MutationObserver, so boxes added later
   get one too) and adds a mic button in its corner. The recording goes to the helper (POST /api/transcribe:
   ffmpeg + faster-whisper small.en, tools/transcribe/). The text is inserted at the cursor and the box's
   normal input event saves it. Nothing is graded or sent by itself. No helper (or no speech setup): no mics. */
let micOK=false, rec=null;
const touched=new WeakSet(); // boxes the student has clicked into: insert at their cursor, else at the end
document.addEventListener("focusin",e=>{if(e.target.matches&&e.target.matches("textarea,input"))touched.add(e.target)});
const micBoxes=root=>[...root.querySelectorAll('textarea:not([readonly]):not([data-mic]),input[type=text]:not([data-mic])')];
function attachMics(root=document){
  if(!micOK) return;
  micBoxes(root).forEach(el=>{
    el.dataset.mic="1";
    const w=document.createElement("span"); w.className="micwrap"+(el.tagName==="INPUT"?" one":"");
    el.replaceWith(w); w.append(el);
    w.insertAdjacentHTML("beforeend",`<button type="button" class="mic" aria-label="Speak instead of typing" title="Speak instead of typing (press again or Esc to stop)">${ICON.mic}</button><span class="micstat" hidden></span>`);
  });
}
new MutationObserver(()=>{if(micOK)attachMics()}).observe(document.body,{childList:true,subtree:true});
function boxKey(el){ // finds the same box again if render() replaced it while we waited
  if(el.id) return "#"+CSS.escape(el.id);
  const k=Object.keys(el.dataset).find(k=>k!=="mic");
  return k?`[data-${k.replace(/[A-Z]/g,c=>"-"+c.toLowerCase())}="${CSS.escape(el.dataset[k])}"]`:null;
}
function boxBlock(el){ // the part a box belongs to (data-ans="b02?0", data-iv="b02:0", …), else the current part
  for(const v of Object.values(el.dataset)){const b=blockById(String(v).split(/[:?]/)[0]); if(b) return b;}
  return blockById(S.cur)||D.blocks[0];
}
function micPrompt(b){ // Whisper's initial_prompt: the course's and this part's key terms, so technical words come out right
  const text=[b.summary,(b.watchFor||[]).join(" "),b.explain,b.code,b.oneLiner].join(" ");
  const terms=new Set([...(D.terms||[]),...(b.terms||[])]);
  for(const m of text.matchAll(/<code>([^<]{2,40})<\/code>|`([^`]{2,40})`/g)) terms.add((m[1]||m[2]).replace(/&[a-z]+;/g,"").trim());
  for(const m of text.replace(/<[^>]+>/g," ").matchAll(/\b(?:[a-z]+[A-Z]\w*|[A-Z][a-z]+[A-Z]\w*|[A-Z]{2,}\w*)\b/g)) terms.add(m[0]);
  const list=[...terms].filter(t=>t&&!/[{};]/.test(t)).slice(0,40).join(", ");
  return `${D.title}. ${b.title}. ${D.micContext||"C programming on Windows, Visual Studio, compiler, linker, debugger."} ${list}.`.slice(0,800);
}
function micStatus(w,cls,text){const s=w.querySelector(".micstat"); if(!s) return; s.className="micstat"+(cls?" "+cls:""); s.textContent=text; s.hidden=!text;}
function micButton(w,on){const b=w.querySelector(".mic"); if(!b) return; b.classList.toggle("rec",on); b.innerHTML=on?ICON.stop:ICON.mic;
  b.setAttribute("aria-label",on?"Stop recording":"Speak instead of typing");}
/* Live dictation, like a chat app: the recorder hands over a chunk every second; while you speak, the audio so far
   is re-transcribed (fast pass, ?live=1) about every 1.5 s and shown in the box, which is read-only meanwhile.
   Pressing stop sends the whole recording once more (careful pass) and that final text replaces the live one. */
const LIVE_EVERY=1500;
function micCompose(r,text){ // the box's original text with `text` at the saved cursor
  const v=r.base, [a,z]=r.cur||[v.length,v.length];
  const pre=a>0&&text&&!/\s$/.test(v.slice(0,a))?" ":"", post=z<v.length&&text&&!/^\s/.test(v.slice(z))?" ":"";
  return {value:v.slice(0,a)+pre+text+post+v.slice(z), end:a+pre.length+text.length};
}
function micFind(r){return r.el.isConnected?r.el:(r.key&&document.querySelector(r.key));} // the box may have been re-rendered
function micShow(r,text,final){
  const el=micFind(r); if(!el) return null;
  const {value,end}=micCompose(r,text);
  el.value=value; el.readOnly=!final;
  if(final){el.focus(); el.setSelectionRange(end,end); touched.add(el);} else el.scrollTop=el.scrollHeight;
  return el;
}
async function micTranscribe(r,blob,live){
  const res=await (await fetch("/api/transcribe?"+(live?"live=1&":"")+"prompt="+encodeURIComponent(micPrompt(r.b)),{method:"POST",headers:{"Content-Type":blob.type},body:blob})).json();
  if(res.error) throw new Error(res.error);
  return (res.text||"").trim();
}
async function micLive(r){
  if(r.stopped||r.busy||!r.chunks.length) return;
  r.busy=true;
  try{const text=await micTranscribe(r,new Blob(r.chunks,{type:r.mr.mimeType||"audio/webm"}),true); if(!r.stopped&&text){r.partial=text; micShow(r,text,false);}}
  catch(e){} // a missed live update is fine; the final pass still runs
  finally{r.busy=false;}
}
async function micStart(btn){
  const w=btn.closest(".micwrap"), el=w.querySelector("textarea,input");
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}
  catch(e){toast(e.name==="NotAllowedError"?"The microphone is blocked. Allow it for this page, or type.":"No microphone found. You can type.");return}
  const mr=new MediaRecorder(stream), chunks=[];
  const cur=touched.has(el)?[el.selectionStart,el.selectionEnd]:null;
  const rec0=rec={mr,w,el,key:boxKey(el),cur,b:boxBlock(el),t0:Date.now(),tick:null,chunks,base:el.value,partial:"",busy:false,stopped:false,live:null};
  mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  mr.onstop=()=>{stream.getTracks().forEach(t=>t.stop()); micSend(rec0,new Blob(chunks,{type:mr.mimeType||"audio/webm"}));};
  mr.start(1000); el.readOnly=true; micButton(w,true); micStatus(w,"rec","● 0:00");
  rec.tick=setInterval(()=>{const s=(Date.now()-rec0.t0)/1000; const box=micFind(rec0), bw=box&&box.closest(".micwrap");
    if(bw){micStatus(bw,"rec","● "+fmt(s)); micButton(bw,true);} if(s>=300) micStop();},500); // 5 min max
  rec.live=setInterval(()=>micLive(rec0),LIVE_EVERY);
}
function micStop(){
  if(!rec) return; const r=rec; rec=null; r.stopped=true;
  clearInterval(r.tick); clearInterval(r.live);
  const box=micFind(r), bw=box&&box.closest(".micwrap"); if(bw) micButton(bw,false);
  if(r.mr.state!=="inactive") r.mr.stop();
}
async function micSend(r,blob){
  const status=(c,t)=>{const el=micFind(r); const w=el&&el.closest(".micwrap"); if(w) micStatus(w,c,t);};
  const lock=on=>{const el=micFind(r), b=el&&el.closest(".micwrap")?.querySelector(".mic"); if(b) b.disabled=on;};
  const done=text=>{const el=micShow(r,text,true); if(el&&el.value!==r.base) el.dispatchEvent(new Event("input",{bubbles:true}));}; // the box's normal save
  if(Date.now()-r.t0<600||blob.size<1000){done("");status("","");toast("Too short. Press the mic, speak, then press it again.");return}
  status("","Finishing…"); lock(true);
  try{
    const text=await micTranscribe(r,blob,false);
    if(!text&&!r.partial){done("");toast("I didn't hear any words. Try again, a bit closer to the mic.");return}
    if(!micFind(r)){toast("The box is gone, so the text wasn't added.");return}
    done(text||r.partial);
  }catch(e){done(r.partial);toast(r.partial?"Kept the live text; the final check failed.":"Couldn't turn the speech into text. Your box is unchanged.");}
  finally{status("",""); lock(false);}
}
document.addEventListener("click",e=>{
  const btn=e.target.closest(".mic"); if(!btn) return;
  e.preventDefault(); e.stopPropagation();
  if(rec&&(micFind(rec)?.closest(".micwrap")||rec.w)===btn.closest(".micwrap")){micStop();return}
  micStop(); micStart(btn); // only one box records at a time
},true);

/* ---------- time: estimates and the session planner ---------- */
const est=b=>{const [st,en]=range(b);return Math.ceil((en-st)/60)+1+(b.practiceMinutes||5)};
const estLeft=b=>{const d=S.done[b.id]||{},[st,en]=range(b),at=Math.max(st,Math.min(en,S.vt[b.id]||st));return Math.max(1,Math.ceil((d.watch?0:(en-at)/60)+(d.recall?0:1)+(d.experiment?0:(b.practiceMinutes||5))))};
function sessionActive(){const x=S.session;return x&&(Date.now()-x.start)<(x.min*60000+3*3600000)}
function minsLeft(){const x=S.session;return x?Math.round((x.start+x.min*60000-Date.now())/60000):null}
function planHTML(){
  if(S.brk||S.stopped||allDone()) return "";
  if(!sessionActive()) return `<div class="plan"><b>How much time do you have today?</b> I'll plan what fits and tell you when to wrap up.
    <div class="timechips">${[15,30,45,60,90].map(m=>`<button class="btn ghost small" data-sess="${m}">${m<60?m+" min":(m/60)+" h"}</button>`).join("")}<button class="btn ghost small" data-sess="0">No limit</button></div></div>`;
  const x=S.session, left=minsLeft(), due=dueReviews.length;
  if(!x.min) return "";
  let budget=Math.max(0,left-2), items=[];
  if(due){const w=Math.min(5,Math.ceil(due*1.5));items.push(`Review: ${due} item${due>1?"s":""} (~${w} min)`);budget-=w;}
  for(const b of pendingPractice()){const need=b.practiceMinutes||5;items.push(`Finish pending practice: Part ${idxOf(b)+1} (~${need} min)`);budget-=need;}
  let i=frontier(), first=true;
  while(i<D.blocks.length){const b=D.blocks[i],need=first?estLeft(b):est(b);
    if(need>budget&&!first) break;
    items.push(`${first&&blockDone(b)?"Finish":"Do"} Part ${i+1}: ${esc(b.title)} (~${need} min)${need>budget?" — may not fit fully; stop at the end of a step":""}`);
    budget-=need; first=false; i++; if(budget<=0) break;}
  items.push("Last 2 min: save and Stop for today");
  const warn=left<=2;
  return `<div class="plan ${warn?"warn":""}"><b>${warn?(left>0?`${left} min left: finish this step, then press “Finish part” or Stop for today.`:"Time's up. Finish this step and stop for today."):`Today's plan (${x.min>=60?(x.min/60)+" h":x.min+" min"})`}</b>
    ${warn?"":`<ol>${items.map(t=>`<li>${t}</li>`).join("")}</ol>`}
    <div class="row"><button class="btn ghost small" data-sess="reset">Change time</button>${warn?`<button class="btn small" data-go="stop">Stop for today</button>`:""}</div></div>`;
}

    <p><b>Focus:</b> ${md(b.focus||b.oneLiner||b.summary)}</p>

    <div class="copybox" id="quickcb"></div><div id="quickfb">${checkFeedback(attempts)}</div>

    ${rubricHTML(check.rubric)}

    ${sample?`<details class="model" id="chathelp"><summary>Ask about this part</summary><div class="chatlog" id="chatlog">${(S.notes[b.id]||[]).map(m=>`<div class="msg ${m.r==="user"?"u":"a"}">${esc(m.c)}</div>`).join("")}</div><textarea id="chatin" placeholder="Your question…"></textarea><button class="btn" id="chatgo">Ask</button></details>`:""}
    ${(S.park[b.id]||[]).length?`<div class="park"><h3>Your questions</h3><ul class="plist" id="plist">${parkItems(b,true)}</ul></div>`:""}`;
  }

  if(k==="explain") return (b.anim?`<figure class="anim"><video src="${esc(b.anim)}" controls playsinline preload="metadata"></video></figure>`:"")
    + (b.oneLiner?`<div class="callout"><b>The idea in one sentence:</b> ${md(b.oneLiner)}</div>`:"")
    + (b.analogy?`<p><b>Real-life picture:</b> ${md(b.analogy)}</p>`:"")
    + b.explain + (b.prereq?`<div class="callout"><b>Prerequisite, explained now:</b> ${b.prereq}</div>`:"")
    + (b.mistake?`<div class="callout later"><b>Common beginner mistake:</b> ${md(b.mistake)}</div>`:"");
  if(k==="experiment") return `<p><b>One task (~${b.practiceMinutes||5} min).</b></p>${b.practice||b.experiment}
    <p class="small">If you already wrote and verified this change while watching, record that result here. Do not repeat it. For a coding task: predict → write → build/run → compare.</p>
    <p class="small muted">Write one line about what you observed. If you cannot try it now, note what remains to do.</p>

    ${(b.interview||[]).length?`<details class="model"><summary>Optional interview practice</summary>${b.interview.map((iv,i)=>ivBlock(b,i,iv,true)).join("")}</details>`:""}`;

  if(k==="code") return b.code;
  if(k==="visual") return b.visual||"";
  return "";
}
const GRADE_RULES=`Grade only the ideas explicitly requested in the QUESTION and its FIXED CHECKLIST. Context and reference notes are background, never extra requirements. Award each listed idea up to its stated weight, in the same order. Never invent criteria or bonus deductions. Accept correct ideas in any words; ignore grammar, spelling, filler words and minor speech-transcription errors. Wrong claims affect only the relevant criterion. Be concise: one sentence on what is right. If below 80%, give ONE short hint or correction for the main gap. At 80%+ with no major misconception, let the learner continue; do not demand 100% or another wording. Do not repeat the full answer or every note. Return awards, one number per checklist item. Simple English.`;

function scoreColor(n){return n>=80?"var(--good)":n>=50?"var(--warn)":"var(--bad)"}
function renderScore(fb){
  if(fb.verdict&&fb.score===undefined) return renderFb(fb);
  const n=Math.max(0,Math.min(100,Math.round(+fb.score||0)));
  return `<div class="fb fbs"><div class="score">Score: ${n}%<span class="sbar"><i style="width:${n}%;background:${scoreColor(n)}"></i></span></div>
  ${fb.right?`<p style="margin:8px 0 0"><b>Right:</b> ${esc(fb.right)}</p>`:""}
  ${(fb.missing||[]).length?`<p style="margin:8px 0 0"><b>To improve:</b></p><ul class="miss">${fb.missing.map(m=>`<li>${esc(m.point)} <span class="muted">(${Math.round(+m.pct||0)}%)</span></li>`).join("")}</ul>`:""}
  ${fb.guide?`<p style="margin:8px 0 0"><b>Next:</b> ${esc(fb.guide)}</p>`:""}
  ${fb.rewatch?`<p class="small muted" style="margin:6px 0 0">Rewatch: ${esc(fb.rewatch)}</p>`:""}</div>`;
}
function normFb(r,rubric){
  if(!rubric.length||rubric.some(([idea,w])=>!Number.isInteger(w)||w<=0)||rubric.reduce((n,[idea,w])=>n+w,0)!==100)throw new Error("This checklist needs weights totaling 100.");
  if(!Array.isArray(r.awards)||r.awards.length!==rubric.length) throw new Error("The check returned incomplete marks. Try again.");
  const awards=rubric.map(([idea,weight],i)=>{
    const n=r.awards[i]; if(typeof n!=="number"||!Number.isFinite(n)) throw new Error("The check returned invalid marks. Try again.");
    return Math.round(Math.max(0,Math.min(weight,n)));
  });
  const score=Math.round(awards.reduce((a,n)=>a+n,0));
  return {v:3,score,awards,right:String(r.right||""),missing:rubric.map(([point,weight],i)=>({point,pct:Math.round(weight-awards[i])})).filter(x=>x.pct>0),guide:score<80?String(r.guide||""):"",rewatch:String(r.rewatch||"")};
}
const JSON_SHAPE=`Reply with only JSON: {"awards":[points for each fixed checklist item, in order],"right":"one short sentence","guide":"one short hint or correction if below 80%, otherwise empty","rewatch":"m:ss-m:ss or empty"}`;

function parkItems(b,actions){

   ${p.status!=="open"?`<span class="chip ${p.status}">${p.status==="later"?"later":"answered"}</span>`:""}
   ${actions?`<span class="row" style="margin:0">${sample?`<button class="btn ghost small" data-pask="${i}">Ask Claude</button>`:`<button class="btn ghost small" data-pcopy="${i}">Copy for Claude</button>`}<button class="btn ghost small" data-pset="${i}:later">Later</button><button class="btn ghost small" data-pset="${i}:done">Answered</button></span>
   <div class="pans small" id="pans-${i}" style="flex-basis:100%">${p.ans?esc(p.ans):""}</div>`:""}</li>`).join("");
}

function reviewItem(row){
  const m=row.source.match(/^courses\/(.+)#([^/]+)(?:\/(iv|dbg)(\d+))?$/);
  if(!m||m[1]!==kitPath)return null;
  const b=blockById(m[2]);if(!b)return null;
  if(m[3]==="iv"){const iv=(b.interview||[])[+m[4]];return iv?{b,check:{q:iv.q,rubric:iv.strong}}:null;}
  if(m[3]==="dbg"){const c=(b.debug||[])[+m[4]];return c?{b,check:{q:c.task,rubric:c.strong},scenario:c.scenario}:null;}
  return {b,check:{...checkFor(b),q:b.reviewQuestion||checkFor(b).q}};
}
function renderReview(){

function goNextStep(){
  referenceStep=null;
  const b=blockById(S.cur); if(!b) return;
  if(S.step==="recall"&&!(S.checkAnswers[b.id]||"").trim()){askFirst(`[data-shortcheck="${b.id}"]`,"Write a short answer first, then continue.");return}
  if(S.step==="experiment"&&!(S.practice[b.id]||"").trim()){askFirst(`[data-practice="${b.id}"]`,"Write one line first: what happened, or what is still to do. Then press the button again.");return}
  (S.done[b.id]=S.done[b.id]||{})[S.step]=true;
  const st=stepsFor(b),i=st.findIndex(([k])=>k===S.step);
  if(i<st.length-1){S.step=st[i+1][0];}
  else{
    const fresh=!S.completed[b.id]; // a revisited part goes straight on; only new work counts toward a break
    if(fresh){S.cdate[b.id]=new Date().toISOString().slice(0,10);S.sessionParts=(S.sessionParts||0)+1;} S.completed[b.id]=true;
    const nb=D.blocks[idxOf(b)+1];
    if(nb){S.cur=nb.id;S.step="watch";S.brk=fresh&&S.sessionParts%LONG_EVERY===0?{from:b.id,until:null}:null;}
    else{S.cur=D.qa?"__qa":b.id; toast("Last part finished");}
  }
  S.lessonViews=S.lessonViews||{};S.lessonViews[S.cur]=S.step;
  save();render();window.scrollTo({top:0});
}
/* A step that needs a line from you says so beside the button and takes you to the box,

function askFirst(selector,message){
  const box=document.querySelector(selector);
  if(box){box.classList.add("needs-input");box.scrollIntoView({block:"center",behavior:"smooth"});box.focus({preventScroll:true});
    box.addEventListener("input",()=>{box.classList.remove("needs-input");document.querySelector(".next-hint")?.remove();},{once:true});}
  const next=document.querySelector("#pane")?.closest("section")?.querySelector(".next");
  if(next){next.querySelector(".next-hint")?.remove();next.insertAdjacentHTML("beforeend",`<p class="next-hint" role="alert">${esc(message)}</p>`);}
  else toast(message);
}

/* Mark the first whole-word occurrence of each key term with a pill. Matching runs on the raw
   text, so entities, `code` spans and earlier pills are never split or nested. */
function xcHighlight(text,terms){
  text=String(text||'');const taken=[];
  for(const m of text.matchAll(/`[^`]+`/g))taken.push([m.index,m.index+m[0].length,null]);
  const word=/\w/,free=(a,b)=>!taken.some(([x,y])=>a<y&&b>x);
  for(const term of terms||[]){
    if(!term)continue;
    for(let i=text.indexOf(term);i>=0;i=text.indexOf(term,i+1)){
      const j=i+term.length,edge=(word.test(term[0])&&word.test(text[i-1]||''))||(word.test(term[term.length-1])&&word.test(text[j]||''));
      if(!edge&&free(i,j)){taken.push([i,j,term]);break;}
    }
  }
  let out='',at=0;
  for(const [i,j,term] of taken.filter(t=>t[2]).sort((p,q)=>p[0]-q[0])){out+=md(text.slice(at,i))+`<mark class="xc-pill${term.length<=18?' xc-nowrap':''}">${md(term)}</mark>`;at=j;}
  return out+md(text.slice(at));
}

function plainText(html){return String(html||'').replace(/<[^>]*>/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&').replace(/\s+/g,' ').trim();}

function pseudocodeSteps(b){const say=(b.say||{}).code||[];const first=say[0];if(first&&Array.isArray(first.steps))return first.steps;if(Array.isArray(first))return first;if(typeof first==='string')return [first];return [b.oneLiner||b.summary];}

function toolsRail(b){const deferred=b.deferred||[],count=(b.cards||[]).length;return `<aside class="learning-tools" aria-label="Learning tools"><section class="tool-card flashcard-tool"><h2 class="wood">${uiIcon('cards')} Flashcards</h2><div class="tool-body"><div class="card-illustration" aria-hidden="true"><span></span><span></span><span>✦</span></div><p>Key concepts from this lesson.</p><span class="count-pill">${count} card${count===1?'':'s'}</span><button class="btn amber" data-ui="flashcards" ${count?'':'disabled'}>Study Flashcards →</button></div></section><section class="tool-card"><h2>${uiIcon('flask')} Experiment / Prediction</h2><div class="tool-body"><p>Before trying it, make a prediction:</p><div class="prediction-prompt">${md(b.guess||checkFor(b).q)}</div><button class="btn amber" data-ui="prediction">${uiIcon('play')} Make a Prediction</button><button class="btn ghost" data-ui="experiment">${uiIcon('flask')} Run Experiment</button></div></section><section class="tool-card"><h2>${uiIcon('layers')} Deferred Topics</h2><div class="tool-body"><p>Important ideas we'll come back to later.</p>${deferred.length?`<ul class="deferred-list">${deferred.slice(0,4).map((text,i)=>`<li><button data-ui="deferred" data-index="${i}">${esc(deferredTitle(text))}</button></li>`).join('')}</ul>`:`<p class="empty-tool">No deferred topics in this part.</p>`}</div></section></aside>`;}
function selectStudyView(key){if(!VIEW_STEPS.some(([k])=>k===key))return false;referenceStep=key;S.lessonViews=S.lessonViews||{};S.lessonViews[S.cur]=key;save();flashcardIndex=0;flashcardAnswer=false;return true;}

const baseRenderStepRaw=renderStepRaw;

function flashcardContent(){const cards=activeLesson().cards||[];if(!cards.length)return '<p>No flashcards for this part.</p>';flashcardIndex=Math.min(flashcardIndex,cards.length-1);const card=cards[flashcardIndex];return `<p class="flashcard-counter">Card ${flashcardIndex+1} of ${cards.length}</p><div class="flashcard-face">${md(card[flashcardAnswer?1:0])}</div><div class="row"><button class="btn amber" data-ui="flip-card">${flashcardAnswer?'Show question':'Reveal answer'}</button><button class="btn ghost" data-ui="previous-card" ${flashcardIndex?'':'disabled'}>Previous</button><button class="btn ghost" data-ui="next-card" ${flashcardIndex===cards.length-1?'disabled':''}>Next →</button></div>`;}

function searchLessons(value){const text=value.trim().toLowerCase(),box=$('#search-results'),input=$('#lesson-search');input.setAttribute('aria-expanded',text?'true':'false');if(!text){box.hidden=true;box.innerHTML='';return;}const results=D.blocks.filter(b=>(b.title+' '+b.summary+' '+codeText(b)).toLowerCase().includes(text));box.innerHTML=results.length?results.slice(0,8).map(b=>`<button data-blk="${b.id}" ${unlocked(b)?'':'disabled'}>${esc(b.title)}<small>${b.start}–${b.end}${unlocked(b)?'':' · Later in this episode'}</small></button>`).join(''):'<p>No matching lessons. Try “compiler”, “function” or “Windows”.</p>';box.hidden=false;}

document.addEventListener('click',async e=>{
