<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Lab</title>
<style>
html,body{height:100%;margin:0;background:#1e1e1e}
body{display:flex;flex-direction:column}
#lab{flex:1}
.back{position:fixed;right:12px;bottom:10px;font:12px -apple-system,"Segoe UI",system-ui,sans-serif;color:#9a9a9a}

<body>
<div id="lab"></div>

/*CODELAB_APP*/
