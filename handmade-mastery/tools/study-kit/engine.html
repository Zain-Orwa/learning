<style>
/* Layout: debugger-style split. Left "call stack" of parts (future parts locked), right the current part.
   The current step carries the yellow instruction-pointer arrow. The video player lives inside the Watch step. */
:root{
  --paper:#f5f6f2; --panel:#ffffff; --ink:#1a222c; --muted:#5b6672; --rule:#dde1da;
  --ip:#f2c230; --ip-ink:#3b2c00; --link:#2350c8; --code-bg:#eef0ea; --good:#2f7d4f; --warn:#a8641a; --bad:#b33a3a;
  --chip:#e8ebe4; --screen:#0f1317; --screen-ink:#e3e7ea;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#13171c; --panel:#1a1f26; --ink:#e3e7ea; --muted:#9aa4ad; --rule:#2c333c;
  --ip:#e8b923; --ip-ink:#1e1600; --link:#8fb0ff; --code-bg:#0f1317; --good:#6cc48f; --warn:#e0a35a; --bad:#ec7f7f; --chip:#242b33; --screen:#07090b; --screen-ink:#e3e7ea; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#13171c; --panel:#1a1f26; --ink:#e3e7ea; --muted:#9aa4ad; --rule:#2c333c;
  --ip:#e8b923; --ip-ink:#1e1600; --link:#8fb0ff; --code-bg:#0f1317; --good:#6cc48f; --warn:#e0a35a; --bad:#ec7f7f; --chip:#242b33; --screen:#07090b; --screen-ink:#e3e7ea; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important} /* the hidden attribute must beat any display rule (e.g. the end-of-part screen) */
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;margin:0}
a{color:var(--link)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px;max-width:1240px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--rule)}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,4vw,40px);line-height:1.05;margin:4px 0 0;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.2;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:18px;margin:18px 0 6px}
.meter{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.meter .bar{width:160px;height:8px;background:var(--chip);border-radius:4px;overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--ip)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:16px 0}
nav.tabs button{border:1px solid var(--rule);background:var(--panel);padding:6px 14px;border-radius:6px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:15px}
nav.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
nav.tabs .badge{font-family:var(--f-mono);font-size:12px;background:var(--ip);color:var(--ip-ink);border-radius:9px;padding:0 6px;margin-left:6px}
.grid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
/* call stack */
.stack{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);border:1px solid var(--rule);background:var(--panel);border-radius:8px;overflow:hidden}
@media (max-width:860px){.stack{position:static}}
.stack .hd{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between}
.stack ol{list-style:none;margin:0;padding:0;max-height:70vh;overflow:auto}
@media (max-width:860px){.stack ol{max-height:220px}}
.stack li>*{box-sizing:border-box;display:grid;grid-template-columns:18px 1fr auto;gap:8px;width:100%;padding:8px 12px;border-bottom:1px solid var(--rule);font-size:14px;line-height:1.35;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.stack li button{cursor:pointer}
.stack li button:hover{background:var(--chip)}
.stack li [aria-current="true"]{background:color-mix(in srgb,var(--ip) 22%,var(--panel))}
.stack li .locked{color:var(--muted)}
.stack .arrow{width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:10px solid transparent;margin-top:5px}
.stack [aria-current="true"] .arrow{border-left-color:var(--ip)}
.stack .t{font-family:var(--f-display);font-weight:600}
.stack .ts{font-family:var(--f-mono);font-size:11px;color:var(--muted);display:block;font-weight:400}
.stack .ck{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.stack .ck.full{color:var(--good)}
/* block */
.block{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:20px clamp(16px,3vw,32px) 28px;min-width:0}
.bhead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.tsr{font-family:var(--f-mono);font-size:13px;background:var(--chip);padding:2px 8px;border-radius:4px;white-space:nowrap}
.steps{display:flex;margin:18px 0 6px;overflow-x:auto;border-bottom:1px solid var(--rule)}
.steps button{all:unset;cursor:pointer;padding:8px 12px 10px 22px;position:relative;font-family:var(--f-display);font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.steps button:disabled{cursor:default;opacity:.45}
.steps button:focus-visible{outline:2px solid var(--link)}
.steps button.done{color:var(--ink)}
.steps button.done::after{content:"✓";font-family:var(--f-mono);font-size:11px;color:var(--good);margin-left:5px}
.steps button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -3px 0 var(--ip)}
.steps button[aria-selected="true"]::before{content:"";position:absolute;left:6px;top:13px;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:10px solid var(--ip)}
.stepnote{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin:10px 0 0}
.pane{max-width:72ch}
.pane p{margin:10px 0}
.pane ul,.pane ol{padding-left:22px}
.pane li{margin:4px 0}
code{font-family:var(--f-mono);font-size:.86em;background:var(--code-bg);padding:1px 5px;border-radius:3px}
pre{font-family:var(--f-mono);font-size:13.5px;line-height:1.55;background:var(--code-bg);border:1px solid var(--rule);border-radius:6px;padding:14px 16px;overflow-x:auto;margin:12px 0}
pre code{background:none;padding:0;font-size:inherit}
.callout{border-left:4px solid var(--ip);background:color-mix(in srgb,var(--ip) 9%,var(--panel));padding:10px 14px;border-radius:0 6px 6px 0;margin:14px 0}
.callout.later{border-left-color:var(--muted);background:var(--chip)}
.callout b{font-family:var(--f-display)}
.next{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;padding-top:14px;border-top:1px dashed var(--rule)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:6px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:15px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.small{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
textarea,input[type=text]{width:100%;border:1px solid var(--rule);border-radius:6px;background:var(--paper);padding:8px 10px;font-family:var(--f-body);font-size:16px}
textarea{min-height:88px;resize:vertical}
/* player */
.player{background:var(--screen);color:var(--screen-ink);border-radius:8px;overflow:hidden;margin:12px 0;position:relative}
.player video{display:block;width:100%;max-width:100%;aspect-ratio:16/9;background:#000}
.player:fullscreen{display:flex;flex-direction:column;justify-content:center}
.player:fullscreen video{flex:1;aspect-ratio:auto;max-height:calc(100vh - 56px)}
.pctl{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 12px;font-family:var(--f-mono);font-size:13px}
.pctl button{background:transparent;border:1px solid #3a434d;color:var(--screen-ink);border-radius:5px;padding:4px 10px;cursor:pointer;font-family:var(--f-mono);font-size:13px}
.pctl button:hover{border-color:#6b7682}
.pctl button{display:inline-flex;align-items:center;justify-content:center;gap:2px;min-width:38px;min-height:32px}
.pctl svg{width:18px;height:18px;fill:currentColor}
.pbar{flex:1 1 160px;height:10px;background:#2a3139;border-radius:5px;cursor:pointer;position:relative;overflow:hidden;min-width:120px}
.pbar i{position:absolute;inset:0 auto 0 0;background:var(--ip);border-radius:5px}
.pend{position:absolute;inset:0;background:rgba(7,9,11,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px}
.pend b{font-family:var(--f-display);font-size:22px}
.pend .btn{background:var(--ip);color:var(--ip-ink);border-color:var(--ip)}
.pend .btn.ghost{background:transparent;color:var(--screen-ink);border-color:#6b7682}
.drop{border:2px dashed var(--rule);border-radius:8px;padding:22px;text-align:center;margin:12px 0}
.drop.over{border-color:var(--ip);background:color-mix(in srgb,var(--ip) 8%,var(--panel))}
.watchfor{margin:10px 0 0}
.park{border:1px solid var(--rule);border-radius:8px;padding:12px 14px;margin:14px 0;background:var(--paper)}
.park h3{margin:0 0 4px;font-size:16px}
.plist{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
.plist li{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;border-bottom:1px dashed var(--rule);padding-bottom:6px}
.plist .at{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.plist .txt{flex:1 1 220px;min-width:0}
.chip{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-radius:4px;padding:1px 6px;background:var(--chip);color:var(--muted)}
.chip.later{background:color-mix(in srgb,var(--warn) 18%,var(--panel));color:var(--warn)}
.chip.done{background:color-mix(in srgb,var(--good) 18%,var(--panel));color:var(--good)}
.q{border:1px solid var(--rule);border-radius:8px;padding:14px 16px;margin:14px 0}
.q .qn{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.q .qt{font-weight:600;margin:4px 0 10px}
.fb{margin-top:10px;padding:10px 12px;border-radius:6px;background:var(--chip);white-space:pre-wrap}
.verdict{font-family:var(--f-mono);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.v-correct{color:var(--good)} .v-partial{color:var(--warn)} .v-missing{color:var(--bad)}
.score{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-weight:600}
.score .sbar{flex:0 1 180px;height:8px;background:var(--rule);border-radius:4px;overflow:hidden}
.score .sbar i{display:block;height:100%}
.fb.fbs{white-space:normal}
.miss{margin:6px 0 0;padding-left:20px}
.guessbox{border:1px solid var(--ip);border-radius:8px;padding:12px 14px;margin:12px 0;background:color-mix(in srgb,var(--ip) 8%,var(--panel))}
.guessbox h3{margin:0 0 4px;font-size:16px}
.plan{border:1px solid var(--rule);background:var(--panel);border-radius:8px;padding:12px 16px;margin-bottom:16px}
.plan b{font-family:var(--f-display)}
.plan ol{margin:6px 0 0;padding-left:20px}
.plan.warn{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--panel))}
.timechips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#timer{font-family:var(--f-mono);background:var(--ip);color:var(--ip-ink);border-radius:4px;padding:1px 8px}
#timer.low{background:var(--bad);color:#fff}
.ivq{border-left:4px solid var(--link)}
.dbg{border-left:4px solid var(--bad)}
.dbg .clock{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
details.model{margin-top:8px} details.model summary{cursor:pointer;color:var(--muted);font-size:14px}
.card{margin:14px 0}
.card .face{border:1px solid var(--rule);border-radius:10px;min-height:150px;padding:22px;display:flex;flex-direction:column;justify-content:center;background:var(--panel)}
.card .side{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.card .txt{font-size:19px}
.rate{display:flex;gap:8px;flex-wrap:wrap}
.rate button{flex:1 1 90px}
.cardmeta{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-family:var(--f-display);font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.mono{font-family:var(--f-mono);font-size:13px;white-space:nowrap}
.toolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tool{border:1px solid var(--rule);border-radius:8px;padding:14px;background:var(--panel);min-width:0}
.tool h3{margin:0 0 4px}
.tool .k{font-family:var(--f-mono);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.chatlog{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.msg{padding:8px 12px;border-radius:8px;white-space:pre-wrap;max-width:100%}
.msg.u{background:var(--chip);align-self:flex-end}
.msg.a{border:1px solid var(--rule)}
.muted{color:var(--muted)}
.small{font-size:14px}
.loop{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0;font-family:var(--f-mono);font-size:13px}
.loop span{background:var(--chip);border-radius:4px;padding:3px 8px}
.loop span.on{background:var(--ip);color:var(--ip-ink)}
.center{text-align:center}
.bigtime{font-family:var(--f-mono);font-size:clamp(44px,9vw,72px);font-weight:600;letter-spacing:-.02em;margin:8px 0}
.welcome{border:1px solid var(--ip);background:color-mix(in srgb,var(--ip) 10%,var(--panel));border-radius:8px;padding:14px 18px;margin-bottom:16px}
.welcome b{font-family:var(--f-display)}
.copybox{margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:6px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
.gq{margin:14px 0}
.gq .qt{font-weight:600;margin:4px 0 8px}
.gq .qn{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.gmine{border-left:3px solid var(--ip);padding:6px 12px;border-radius:0 6px 6px 0;background:color-mix(in srgb,var(--ip) 7%,var(--panel));white-space:pre-wrap}
.cover{background:var(--screen);color:var(--screen-ink);border-radius:8px;aspect-ratio:16/9;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px;margin:12px 0}
.cover b{font-family:var(--f-display);font-size:22px}
.cover .btn{background:var(--ip);color:var(--ip-ink);border-color:var(--ip)}
.nudge{border-left:4px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--panel));padding:8px 12px;border-radius:0 6px 6px 0;margin:12px 0}
.anim{margin:12px 0}
.anim video{display:block;width:100%;max-width:100%;border-radius:8px;background:#000}
.listen{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 6px}
.listen .btn{display:inline-flex;align-items:center;gap:6px}
.listen svg{width:16px;height:16px;fill:currentColor}
.inwords{border:1px dashed var(--rule);border-radius:6px;padding:8px 14px;margin:-4px 0 14px;background:var(--panel)}
.inwords .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.inwords ol{margin:6px 0 0;padding-left:22px}
.inwords .iw{margin:6px 0 0}
.inwords .try{border-top:1px dashed var(--rule);padding-top:6px;margin-top:8px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.reading{background:color-mix(in srgb,var(--ip) 20%,transparent);border-radius:4px;box-shadow:0 0 0 4px color-mix(in srgb,var(--ip) 20%,transparent)}
/* mic: speak instead of typing. attachMics() wraps every text box; the button sits in its bottom-right corner */
.micwrap{display:block;position:relative;flex:1 1 200px;min-width:0}
.micwrap>textarea{display:block;padding-right:58px}
.micwrap>input{padding-right:46px}
.mic{position:absolute;right:20px;bottom:8px;width:30px;height:30px;border-radius:50%;border:1px solid var(--rule);background:var(--panel);color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.micwrap.one .mic{right:6px;bottom:auto;top:50%;transform:translateY(-50%)}
.mic svg{width:16px;height:16px;fill:currentColor}
.mic:hover{color:var(--ink);border-color:var(--muted)}
.mic.rec{background:var(--bad);border-color:var(--bad);color:#fff}
.mic:disabled{opacity:.6;cursor:default}
.micstat{position:absolute;right:58px;bottom:12px;font-family:var(--f-mono);font-size:12px;background:var(--panel);color:var(--muted);border:1px solid var(--rule);border-radius:10px;padding:0 8px;pointer-events:none}
.micwrap.one .micstat{right:44px;bottom:auto;top:50%;transform:translateY(-50%)}
.micstat.rec{color:var(--bad);border-color:var(--bad)}
.micstat.rec::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bad);margin-right:6px;vertical-align:1px;animation:micblink 1s steps(2) infinite}
@keyframes micblink{50%{opacity:.25}}
.ivsay{margin-left:6px;vertical-align:middle;display:inline-flex;align-items:center;gap:4px}
.ivsay svg{width:14px;height:14px;fill:currentColor}
.ivsay.on{background:var(--ip);color:var(--ip-ink);border-color:var(--ip)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(function(){
const D = window.STUDY;
const STEPS = [["watch","Watch"],["recall","Check"],["experiment","Practice"]];
const SHORT_BREAK=2, LONG_BREAK=5, LONG_EVERY=3; // minutes; a long break after every 3 parts
const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today = ()=>Math.floor(Date.now()/86400000);
const secs = t=>String(t).split(":").reduce((a,x)=>a*60+(+x),0);
const fmt = s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")};
const md = s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");

$("#eyebrow").textContent=D.eyebrow||""; $("#h1").textContent=D.title||document.title;

/* ---------- state + persistence ---------- */
const FRESH={v:3,cur:D.blocks[0].id,step:"watch",tab:"path",done:{},completed:{},vt:{},recall:{},cmp:{},guess:{},guesses:{},lb:{},lbShow:{},rfb:{},cdate:{},ivans:{},ivfb:{},dbgs:{},dbgans:{},dbgfb:{},session:null,park:{},answers:{},fb:{},cards:{},checkAnswers:{},checkFb:{},practice:{},practiceDone:{},notes:{},speed:1,lastVisit:0,sessionParts:0,brk:null,stopped:false};
let S=JSON.parse(JSON.stringify(FRESH));
const LS=D.storageKey||"study-kit";

/* ---------- helper mode: ./study runs a small local helper (serve.py) ---------- */
const HELPER_PAGE=/^https?:$/.test(location.protocol)&&!window.claude;
const kitPath=decodeURIComponent(location.pathname).replace(/^\/courses\//,"").replace(/\/study-kit\.html$/,"");
let helperReady=false, videoFolder=null;
function helperMeta(){
  return {kit:kitPath,unitPrefix:D.unitPrefix||D.storageKey,unitLabel:D.unitLabel||D.title,
    completedParts:D.blocks.filter(b=>S.completed[b.id]).map(b=>({id:b.id,n:idxOf(b)+1,title:b.title,date:S.cdate[b.id]||new Date().toISOString().slice(0,10),interview:[],debug:[]}))};
}
function postHelper(url,extra){
  S.finished=allDone();
  return fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({meta:helperMeta(),state:S,position:positionBlock()},extra||{}))}).then(r=>r.json());

async function helperCall(input,json){
  const prompt=typeof input==="string"?input:input.map(m=>(m.role==="user"?"STUDENT: ":"TUTOR: ")+m.content).join("\n\n");
  const r=await (await fetch("/api/claude",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt,json})})).json();
  if(r.error) throw {code:"upstream_error",message:r.error,text:r.text};
  return r;
}
const helperSample=async(input,opts={})=>{const r=await helperCall(input,false);opts.onText&&opts.onText({text:r.text,delta:r.text});return {text:r.text,truncated:false}};
helperSample.json=async input=>(await helperCall(input,true)).data;
(async()=>{

/* ---------- helpers ---------- */
const blockById=id=>D.blocks.find(b=>b.id===id);
const idxOf=b=>D.blocks.indexOf(b);
/* ---------- guesses: the part's main guess plus the key questions listed in b.pre ---------- */
function migrate(){
  S.guesses=S.guesses||{};S.lb=S.lb||{};S.lbShow=S.lbShow||{};
  S.checkAnswers=S.checkAnswers||{};S.checkFb=S.checkFb||{};S.practice=S.practice||{};S.practiceDone=S.practiceDone||{};
  Object.keys(S.guess||{}).forEach(id=>{if(!S.guesses[id])S.guesses[id]=[S.guess[id]]});
  if(!["watch","recall","experiment"].includes(S.step)){
    const d=S.done[S.cur]||{};
    S.step=d.watch?(d.recall?"experiment":"recall"):"watch";
  }
  S.v=3;
}
function stepsFor(b){return STEPS.filter(([k])=>k!=="experiment"||b.practice||b.experiment)}
function blockDone(b){const d=S.done[b.id]||{};return stepsFor(b).filter(([k])=>d[k]).length}
function frontier(){const i=D.blocks.findIndex(b=>!S.completed[b.id]);return i===-1?D.blocks.length:i}
const allDone=()=>frontier()>=D.blocks.length;
const unlocked=b=>idxOf(b)<=frontier();
function stepOpen(b,k){const st=stepsFor(b),i=st.findIndex(([x])=>x===k),d=S.done[b.id]||{};return i>=0&&(d[k]||st.slice(0,i).every(([x])=>d[x]))}
function allCards(){const out=[];D.blocks.forEach(b=>(b.cards||[]).forEach((c,i)=>out.push({id:b.id+"#"+i,b,c})));return out}
function progress(){let tot=0,dn=0;D.blocks.forEach(b=>{tot+=stepsFor(b).length;dn+=blockDone(b)});return tot?Math.round(dn*100/tot):0}
function checkFor(b){return b.check||{q:b.questions[0].q,rubric:[[b.questions[0].a,100]]};}
function rubricText(rubric){return rubric.map(([idea,weight],i)=>`${i+1}. ${idea} (${weight}%)`).join("\n");}
function rubricHTML(rubric){return `<details class="model"><summary>What this check expects</summary><ul>${rubric.map(([idea,weight])=>`<li>${md(idea)} (${weight}%)</li>`).join("")}</ul></details>`;}
function checkPrompt(b,check,answer){return `Check a short answer to this question only. ${GRADE_RULES}\nPART: ${b.title}\nQUESTION: ${check.q}\nFIXED CHECKLIST:\n${rubricText(check.rubric)}\nANSWER: ${answer}\n${JSON_SHAPE}`;}
function checked(b){return !!(S.checkFb[b.id]&&S.checkFb[b.id].score>=80&&S.practiceDone[b.id]&&(S.practice[b.id]||"").trim());}
function blockContext(b){
  const strip=h=>String(h||"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
  return `VIDEO: "${D.title}"${D.eyebrow?" ("+D.eyebrow+")":""}.
PART: ${b.title} (${b.start}-${b.end})
WHAT CASEY COVERS: ${b.summary}
STUDY NOTES: ${strip(b.explain).slice(0,3500)}
TOPICS CASEY PARKS FOR LATER (do not teach these; say they come later): ${(D.parked||[]).map(p=>p.what+" ["+p.where+"]").join("; ")}`;
}

/* ---------- the video player (one element, kept alive across renders) ---------- */
let videoURL=null, playerBlock=null, lastSave=0;
const svg=d=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${d}"/></svg>`;
const ICON={play:svg("M8 5v14l11-7z"),pause:svg("M6 5h4v14H6zM14 5h4v14h-4z"),back:svg("M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"),replay:svg("M6 6h2v12H6zM9.5 12l8.5 6V6z"),fs:svg("M5 5h5v2H7v3H5zM14 5h5v5h-2V7h-3zM5 14h2v3h3v2H5zM17 14h2v5h-5v-2h3z"),
  stop:svg("M6 6h12v12H6z"),mic:svg("M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1a7 7 0 0 0 6-6.9z"),speak:svg("M3 9v6h4l5 5V4L7 9H3zM16.5 12A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z")};
const vw=document.createElement("div"); vw.className="player";
vw.innerHTML=`<video playsinline preload="metadata"></video>
<div class="pctl"><button data-v="play" aria-label="Play" title="Play (Space)">${ICON.play}</button><button data-v="back" aria-label="Back 10 seconds" title="Back 10 seconds">${ICON.back}<span>10</span></button>
<span class="pbar" role="slider" aria-label="Position in this part" tabindex="0"><i></i></span><span class="ptime">0:00 / 0:00</span>
<button data-v="speed" aria-label="Playback speed" title="Speed">1×</button><button data-v="replay" aria-label="Replay this part" title="Replay this part">${ICON.replay}</button><button data-v="fs" aria-label="Full screen" title="Full screen">${ICON.fs}</button></div>
<div class="pend" hidden><b>End of this part</b><span>The video stops here. Now answer one short question.</span><div class="row"><button class="btn" data-v="next">Next: Check →</button><button class="btn ghost" data-v="replay">Replay part</button></div></div>`;
const vid=vw.querySelector("video");
const range=b=>[secs(b.start),secs(b.end)];
function ptick(){
  const b=playerBlock; if(!b||!vid.duration) return;
  const [st,en]=range(b);
  if(vid.currentTime<st-0.4){vid.currentTime=st}
  if(vid.currentTime>=en-0.05){ if(!vid.paused) vid.pause(); if(Math.abs(vid.currentTime-en)>0.2) vid.currentTime=en; partEnded(); }
  const t=Math.min(Math.max(vid.currentTime,st),en);
  vw.querySelector(".pbar i").style.width=((t-st)/(en-st)*100)+"%";
  vw.querySelector(".ptime").textContent=fmt(t-st)+" / "+fmt(en-st);
  const pb=vw.querySelector('[data-v="play"]'), st2=vid.paused?"play":"pause"; if(pb.dataset.icon!==st2){pb.dataset.icon=st2;pb.innerHTML=ICON[st2];pb.setAttribute("aria-label",vid.paused?"Play":"Pause");pb.title=vid.paused?"Play (Space)":"Pause (Space)";}
  if(Date.now()-lastSave>3000){lastSave=Date.now();S.vt[b.id]=t;save();}
}
(function loop(){ if(!vid.paused) ptick(); requestAnimationFrame(loop); })();
vid.addEventListener("timeupdate",ptick); vid.addEventListener("pause",ptick); vid.addEventListener("play",()=>{vw.querySelector(".pend").hidden=true;ptick()});
vid.addEventListener("seeking",()=>{const b=playerBlock;if(!b)return;const [st,en]=range(b);if(vid.currentTime<st)vid.currentTime=st;if(vid.currentTime>en)vid.currentTime=en;});
vid.addEventListener("loadedmetadata",()=>{seekResume();ptick();});
function seekResume(){const b=playerBlock;if(!b||!vid.duration)return;const [st,en]=range(b);let t=S.vt[b.id];if(!(t>=st&&t<en-1))t=st;vid.currentTime=t;vid.playbackRate=S.speed||1;vw.querySelector('[data-v="speed"]').textContent=(S.speed||1)+"×";}
function partEnded(){
  const b=playerBlock; if(!b) return;
  vw.querySelector(".pend").hidden=false; S.vt[b.id]=range(b)[1];
  const d=(S.done[b.id]=S.done[b.id]||{}); if(!d.watch){d.watch=true;save();const st=$(".steps [data-step='watch']");if(st)st.classList.add("done");const nb=$("#markNext");if(nb)nb.textContent="Next step →";}
}
vw.addEventListener("click",e=>{
  const t=e.target.closest("[data-v]"); const b=playerBlock;
  if(t&&b){const [st,en]=range(b),v=t.dataset.v;
    if(v==="play"){ if(vid.paused){ if(vid.currentTime>=en-0.1) vid.currentTime=st; vid.play().catch(()=>{}); } else vid.pause(); }
    if(v==="back"){vid.currentTime=Math.max(st,vid.currentTime-10)}
    if(v==="replay"){vw.querySelector(".pend").hidden=true;vid.currentTime=st;vid.play().catch(()=>{})}
    if(v==="speed"){const sp=[1,1.25,1.5,1.75,2,0.75];S.speed=sp[(sp.indexOf(S.speed||1)+1)%sp.length];vid.playbackRate=S.speed;t.textContent=S.speed+"×";save()}
    if(v==="fs"){ if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); else vw.requestFullscreen?.().catch(()=>toast("Full screen isn't available here")); }
    if(v==="next"){ if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); goNextStep(); }
    ptick(); return;}
  const bar=e.target.closest(".pbar"); if(bar&&b){const r=bar.getBoundingClientRect(),[st,en]=range(b);vid.currentTime=st+(en-st)*Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));ptick();}
});
function loadVideo(file){
  if(!file) return;
  if(videoURL) URL.revokeObjectURL(videoURL);
  videoURL=URL.createObjectURL(file); vid.src=videoURL;
  if(D.video&&D.video.file&&file.name!==D.video.file) toast("Loaded "+file.name+" (expected "+D.video.file+")"); else toast("Video loaded");
  render();
}
document.addEventListener("keydown",e=>{
  if(!playerBlock||!vw.isConnected) return;
  if(e.target.closest&&e.target.closest("input,textarea,select,button")) return;
  if(e.code==="Space"){e.preventDefault();vw.querySelector('[data-v="play"]').click()}
  if(e.code==="ArrowLeft"){e.preventDefault();const [st]=range(playerBlock);vid.currentTime=Math.max(st,vid.currentTime-5)}
});

/* ---------- listen: read the Explain / Read code step aloud ----------
   Kokoro only: tools/voice/make_audio.py renders each piece of text and build.py puts the map into
   D.audio = {blockId: {step: {text: "audio/file.mp3"}}}. The browser's own voice is never used: a piece
   with no mp3 (or a file that fails to load) is skipped. */
const AUD=D.audio||{}, AU=new Audio();
let referenceStep=null;
let tts={segs:[],i:0,on:false,gen:0};
const stepAudio=()=>(AUD[S.cur]||{})[referenceStep||S.step]||null;
const ttsHint=()=>"Natural voice. Code is read as the “In words” version.";
function listenBar(){
  if(!stepAudio()) return `<p class="small muted">Read the notes below.</p>`;
  return `<div class="listen"><button class="btn small" data-tts="play" id="ttsplay">${ICON.speak}<span>Listen</span></button>
  <button class="btn ghost small" data-tts="stop" id="ttsstop" aria-label="Stop" title="Stop" hidden>${ICON.stop}</button>
  <button class="btn ghost small" data-tts="rate" aria-label="Reading speed" title="Reading speed">${S.ttsRate||1}×</button>
  <span class="small muted" id="ttsinfo">${ttsHint()}</span></div>`;
}
function inWords(s){
  if(Array.isArray(s)||typeof s==="string"){ // old format: a plain list of lines
    const lines=Array.isArray(s)?s:String(s).split("\n");
    return `<div class="inwords"><div class="k">In words</div><ol>${lines.map(l=>`<li class="ln">${md(l)}</li>`).join("")}</ol></div>`;
  }
  return `<div class="inwords"><div class="k">In words</div>`
    +(s.goal?`<p class="ln iw"><b>Goal:</b> ${md(s.goal)}</p>`:"")
    +`<ol>${(s.steps||[]).map((l,i)=>`<li class="ln"><span class="vh">Step ${i+1}. </span>${md(l)}</li>`).join("")}</ol>`
    +(s.pattern?`<p class="ln iw"><b>Pattern:</b> ${md(s.pattern)}</p>`:"")
    +(s.tryit?`<p class="ln iw try"><b>Try it in your head:</b> ${md(s.tryit)}</p>`:"")+`</div>`;
}
function withWords(html,say){
  if(!say||!say.length) return html;
  let n=0;
  return html.replace(/<\/pre>|<\/table>/g,m=>{const s=say[n++]; return s?m+inWords(s):m;});
}
function ttsSegments(){ // the pieces that have a Kokoro mp3, in reading order (pieces without one are skipped)
  const pane=$("#pane"); if(!pane) return [];
  const map=stepAudio()||{};
  const els=[...pane.querySelectorAll("h3,p,li,.callout,.inwords .ln")].filter(el=>!el.closest("pre,table,.listen,details"));
  return els.filter(el=>!els.some(o=>o!==el&&o.contains(el))).map(el=>{const key=el.textContent.replace(/\s+/g," ").trim();
    return {el,file:map[key]||null};}).filter(x=>x.file);
}
function ttsSpeak(resume){
  const seg=tts.segs[tts.i]; if(!seg){ttsStop(true);return}
  document.querySelectorAll(".reading").forEach(e=>e.classList.remove("reading"));
  seg.el.classList.add("reading");
  const r=seg.el.getBoundingClientRect(); if(r.top<0||r.bottom>innerHeight) seg.el.scrollIntoView({block:"center",behavior:"smooth"});
  const info=$("#ttsinfo"); if(info) info.textContent=`${tts.i+1} / ${tts.segs.length}`;
  const g=tts.gen; let over=false;
  const next=()=>{if(over||g!==tts.gen)return; over=true; tts.i++; ttsSpeak();}; // a file that fails is skipped too
  if(!(resume&&AU.src===new URL(seg.file,location.href).href)) AU.src=seg.file;
  AU.playbackRate=S.ttsRate||1; AU.onended=next; AU.onerror=next;
  AU.play().catch(e=>{ if(e.name==="NotAllowedError"){if(g===tts.gen){tts.on=false;ttsUi();}return} next(); });
}
function ttsUi(finished){
  const p=$("#ttsplay"),s=$("#ttsstop"),i=$("#ttsinfo"); if(!p) return;
  p.innerHTML=tts.on?ICON.pause+"<span>Pause</span>":ICON.speak+"<span>"+(tts.segs.length&&tts.i>0?"Resume":"Listen")+"</span>";
  s.hidden=!(tts.on||tts.i>0);
  if(i&&!tts.on&&!tts.segs.length) i.textContent=finished?"Done. Press Listen to hear it again.":ttsHint();
}
function ttsHush(){ tts.gen++; AU.pause(); }
function ttsStop(finished){
  ttsHush(); AU.removeAttribute("src");
  tts={segs:[],i:0,on:false,gen:tts.gen};
  document.querySelectorAll(".reading").forEach(e=>e.classList.remove("reading"));
  ttsUi(finished);
}
function ttsCmd(c){
  if(!stepAudio()) return;
  if(c==="rate"){const r=[1,1.25,1.5,0.75];S.ttsRate=r[(r.indexOf(S.ttsRate||1)+1)%r.length];save();
    const b=document.querySelector('[data-tts="rate"]'); if(b) b.textContent=S.ttsRate+"×";
    AU.playbackRate=S.ttsRate; return;} // the mp3 changes speed in place
  if(c==="stop"){ttsStop();return}
  if(tts.on){ttsHush();tts.on=false;ttsUi();return} // pause: keeps the place (an mp3 resumes mid-sentence)
  let resume=true;
  if(!tts.segs.length||tts.i>=tts.segs.length){tts.segs=ttsSegments();tts.i=0;resume=false;}
  if(!tts.segs.length){toast("Nothing to read here");return}
  ivStop(); tts.on=true; ttsUi(); ttsSpeak(resume);
}

/* ---------- mic: speak instead of typing, in EVERY text box ----------
   attachMics() wraps each <textarea> and text <input> (watched by a MutationObserver, so boxes added later
   get one too) and adds a mic button in its corner. The recording goes to the helper (POST /api/transcribe:
   ffmpeg + faster-whisper small.en, tools/transcribe/). The text is inserted at the cursor and the box's
   normal input event saves it. Nothing is graded or sent by itself. No helper (or no speech setup): no mics. */
let micOK=false, rec=null;
const touched=new WeakSet(); // boxes the student has clicked into: insert at their cursor, else at the end
document.addEventListener("focusin",e=>{if(e.target.matches&&e.target.matches("textarea,input"))touched.add(e.target)});
const micBoxes=root=>[...root.querySelectorAll('textarea:not([readonly]):not([data-mic]),input[type=text]:not([data-mic])')];
function attachMics(root=document){
  if(!micOK) return;
  micBoxes(root).forEach(el=>{
    el.dataset.mic="1";
    const w=document.createElement("span"); w.className="micwrap"+(el.tagName==="INPUT"?" one":"");
    el.replaceWith(w); w.append(el);
    w.insertAdjacentHTML("beforeend",`<button type="button" class="mic" aria-label="Speak instead of typing" title="Speak instead of typing (press again or Esc to stop)">${ICON.mic}</button><span class="micstat" hidden></span>`);
  });
}
new MutationObserver(()=>{if(micOK)attachMics()}).observe(document.body,{childList:true,subtree:true});
function boxKey(el){ // finds the same box again if render() replaced it while we waited
  if(el.id) return "#"+CSS.escape(el.id);
  const k=Object.keys(el.dataset).find(k=>k!=="mic");
  return k?`[data-${k.replace(/[A-Z]/g,c=>"-"+c.toLowerCase())}="${CSS.escape(el.dataset[k])}"]`:null;
}
function boxBlock(el){ // the part a box belongs to (data-ans="b02?0", data-iv="b02:0", …), else the current part
  for(const v of Object.values(el.dataset)){const b=blockById(String(v).split(/[:?]/)[0]); if(b) return b;}
  return blockById(S.cur)||D.blocks[0];
}
function micPrompt(b){ // Whisper's initial_prompt: the course's and this part's key terms, so technical words come out right
  const text=[b.summary,(b.watchFor||[]).join(" "),b.explain,b.code,b.oneLiner].join(" ");
  const terms=new Set([...(D.terms||[]),...(b.terms||[])]);
  for(const m of text.matchAll(/<code>([^<]{2,40})<\/code>|`([^`]{2,40})`/g)) terms.add((m[1]||m[2]).replace(/&[a-z]+;/g,"").trim());
  for(const m of text.replace(/<[^>]+>/g," ").matchAll(/\b(?:[a-z]+[A-Z]\w*|[A-Z][a-z]+[A-Z]\w*|[A-Z]{2,}\w*)\b/g)) terms.add(m[0]);
  const list=[...terms].filter(t=>t&&!/[{};]/.test(t)).slice(0,40).join(", ");
  return `${D.title}. ${b.title}. C programming on Windows, Visual Studio, compiler, linker, debugger. ${list}.`.slice(0,800);
}
function micStatus(w,cls,text){const s=w.querySelector(".micstat"); if(!s) return; s.className="micstat"+(cls?" "+cls:""); s.textContent=text; s.hidden=!text;}
function micButton(w,on){const b=w.querySelector(".mic"); if(!b) return; b.classList.toggle("rec",on); b.innerHTML=on?ICON.stop:ICON.mic;
  b.setAttribute("aria-label",on?"Stop recording":"Speak instead of typing");}
async function micStart(btn){
  const w=btn.closest(".micwrap"), el=w.querySelector("textarea,input");
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true});}
  catch(e){toast(e.name==="NotAllowedError"?"The microphone is blocked. Allow it for this page, or type.":"No microphone found. You can type.");return}
  const mr=new MediaRecorder(stream), chunks=[];
  const cur=touched.has(el)?[el.selectionStart,el.selectionEnd]:null;
  const rec0=rec={mr,w,el,key:boxKey(el),cur,b:boxBlock(el),t0:Date.now(),tick:null};
  mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  mr.onstop=()=>{stream.getTracks().forEach(t=>t.stop()); micSend(rec0,new Blob(chunks,{type:mr.mimeType||"audio/webm"}));};
  mr.start(); micButton(w,true); micStatus(w,"rec","0:00");
  rec.tick=setInterval(()=>{const s=(Date.now()-rec0.t0)/1000; micStatus(rec0.w,"rec",fmt(s)); if(s>=300) micStop();},500); // 5 min max
}
function micStop(){
  if(!rec) return; const r=rec; rec=null;
  clearInterval(r.tick); micButton(r.w,false);
  if(r.mr.state!=="inactive") r.mr.stop();
}
async function micSend(r,blob){
  const find=()=>r.el.isConnected?r.el:(r.key&&document.querySelector(r.key)); // the box may have been re-rendered
  const status=(c,t)=>{const el=find(); const w=el&&el.closest(".micwrap"); if(w) micStatus(w,c,t);};
  const lock=on=>{const el=find(), b=el&&el.closest(".micwrap")?.querySelector(".mic"); if(b) b.disabled=on;};
  if(Date.now()-r.t0<600||blob.size<1000){status("","");toast("Too short. Press the mic, speak, then press it again.");return}
  status("","Transcribing…"); lock(true);
  try{
    const res=await (await fetch("/api/transcribe?prompt="+encodeURIComponent(micPrompt(r.b)),{method:"POST",headers:{"Content-Type":blob.type},body:blob})).json();
    if(res.error) throw new Error(res.error);
    const text=(res.text||"").trim(); if(!text){toast("I didn't hear any words. Try again, a bit closer to the mic.");return}
    const el=find(); if(!el){toast("The box is gone, so the text wasn't added.");return}
    const v=el.value, [a,z]=r.cur||[v.length,v.length];
    const pre=a>0&&!/\s$/.test(v.slice(0,a))?" ":"", post=z<v.length&&!/^\s/.test(v.slice(z))?" ":"";
    el.value=v.slice(0,a)+pre+text+post+v.slice(z);
    const end=a+pre.length+text.length; el.focus(); el.setSelectionRange(end,end); touched.add(el);
    el.dispatchEvent(new Event("input",{bubbles:true})); // the box's normal save
  }catch(e){toast("Couldn't turn the speech into text. Your box is unchanged.");}
  finally{status("",""); lock(false);}
}
document.addEventListener("click",e=>{
  const btn=e.target.closest(".mic"); if(!btn) return;
  e.preventDefault(); e.stopPropagation();
  if(rec&&rec.w===btn.closest(".micwrap")){micStop();return}
  micStop(); micStart(btn); // only one box records at a time
},true);

/* ---------- time: estimates and the session planner ---------- */
const est=b=>{const [st,en]=range(b);return Math.ceil((en-st)/60)+Math.max(3,b.practiceMinutes||5)};
const estLeft=b=>Math.max(1,Math.round(est(b)*(1-blockDone(b)/stepsFor(b).length)));
function sessionActive(){const x=S.session;return x&&(Date.now()-x.start)<(x.min*60000+3*3600000)}
function minsLeft(){const x=S.session;return x?Math.round((x.start+x.min*60000-Date.now())/60000):null}
function planHTML(){
  if(S.brk||S.stopped||allDone()) return "";
  if(!sessionActive()) return `<div class="plan"><b>How much time do you have today?</b> I'll plan what fits and tell you when to wrap up.
    <div class="timechips">${[15,30,45,60,90].map(m=>`<button class="btn ghost small" data-sess="${m}">${m<60?m+" min":(m/60)+" h"}</button>`).join("")}<button class="btn ghost small" data-sess="0">No limit</button></div></div>`;
  const x=S.session, left=minsLeft(), due=dueReviews.length;
  if(!x.min) return "";
  let budget=Math.max(0,left-2), items=[];
  if(due){const w=Math.min(5,Math.ceil(due*1.5));items.push(`Review: ${due} item${due>1?"s":""} (~${w} min)`);budget-=w;}
  let i=frontier(), first=true;
  while(i<D.blocks.length){const b=D.blocks[i],need=first?estLeft(b):est(b);
    if(need>budget&&!first) break;
    items.push(`${first&&blockDone(b)?"Finish":"Do"} Part ${i+1}: ${esc(b.title)} (~${need} min)${need>budget?" — may not fit fully; stop at the end of a step":""}`);
    budget-=need; first=false; i++; if(budget<=0) break;}
  items.push("Last 2 min: save and Stop for today");
  const warn=left<=2;
  return `<div class="plan ${warn?"warn":""}"><b>${warn?(left>0?`${left} min left: finish this step, then press “Finish part” or Stop for today.`:"Time's up. Finish this step and stop for today."):`Today's plan (${x.min>=60?(x.min/60)+" h":x.min+" min"})`}</b>
    ${warn?"":`<ol>${items.map(t=>`<li>${t}</li>`).join("")}</ol>`}
    <div class="row"><button class="btn ghost small" data-sess="reset">Change time</button>${warn?`<button class="btn small" data-go="stop">Stop for today</button>`:""}</div></div>`;
}
let warned=false;
function updateTimer(){
  const el=$("#timer"); if(!el) return;
  if(!sessionActive()||!S.session.min){el.hidden=true;return}
  const l=minsLeft(); el.hidden=false; el.textContent=l>0?`${l} min left`:"time's up"; el.classList.toggle("low",l<=2);
  if(l<=2&&!warned){warned=true;toast("2 minutes left. Save and stop when ready.");}
}

function ivPlay(files,btn){
  ivStop(); ttsStop(); files=files.filter(Boolean); if(!files.length) return;

  next();
}

    + b.explain + (b.prereq?`<div class="callout"><b>Prerequisite, explained now:</b> ${b.prereq}</div>`:"")
    + (b.mistake?`<div class="callout later"><b>Common beginner mistake:</b> ${md(b.mistake)}</div>`:"");
  if(k==="experiment") return `<p><b>One task (~${b.practiceMinutes||5} min).</b></p>${b.practice||b.experiment}
    <p class="small muted">Write one line about what you observed. If you cannot try it now, note what remains to do.</p>
    <textarea data-practice="${b.id}" placeholder="What happened? Or: still to do…">${esc(S.practice[b.id]||"")}</textarea>
    <label class="small"><input type="checkbox" data-practiced="${b.id}" ${S.practiceDone[b.id]?"checked":""}> I tried the task and checked the result</label>
    ${b.code?`<button class="btn ghost small" data-reference="code">Code reference</button>`:""}
    ${(b.debug||[]).length?`<details class="model"><summary>Optional debugging practice</summary>${b.debug.map((c,i)=>dbgBlock(b,i,c,true)).join("")}</details>`:""}
    ${(b.interview||[]).length?`<details class="model"><summary>Optional interview practice</summary>${b.interview.map((iv,i)=>ivBlock(b,i,iv,true)).join("")}</details>`:""}`;

  if(k==="code") return b.code;
  return "";
}
const GRADE_RULES=`Grade only the ideas explicitly requested in the QUESTION and its FIXED CHECKLIST. Context and reference notes are background, never extra requirements. Award each listed idea up to its stated weight, in the same order. Never invent criteria or bonus deductions. Accept correct ideas in any words; ignore grammar, spelling, filler words and minor speech-transcription errors. Wrong claims affect only the relevant criterion. Be concise: one sentence on what is right. If below 80%, give ONE short hint or correction for the main gap. At 80%+ with no major misconception, let the learner continue; do not demand 100% or another wording. Do not repeat the full answer or every note. Return awards, one number per checklist item. Simple English.`;

function scoreColor(n){return n>=80?"var(--good)":n>=50?"var(--warn)":"var(--bad)"}
function renderScore(fb){
  if(fb.verdict&&fb.score===undefined) return renderFb(fb);
  const n=Math.max(0,Math.min(100,Math.round(+fb.score||0)));
  return `<div class="fb fbs"><div class="score">Score: ${n}%<span class="sbar"><i style="width:${n}%;background:${scoreColor(n)}"></i></span></div>
  ${fb.right?`<p style="margin:8px 0 0"><b>Right:</b> ${esc(fb.right)}</p>`:""}
  ${(fb.missing||[]).length?`<p style="margin:8px 0 0"><b>To improve:</b></p><ul class="miss">${fb.missing.map(m=>`<li>${esc(m.point)} <span class="muted">(${Math.round(+m.pct||0)}%)</span></li>`).join("")}</ul>`:""}
  ${fb.guide?`<p style="margin:8px 0 0"><b>Next:</b> ${esc(fb.guide)}</p>`:""}
  ${fb.rewatch?`<p class="small muted" style="margin:6px 0 0">Rewatch: ${esc(fb.rewatch)}</p>`:""}</div>`;
}
function normFb(r,rubric){
  if(!rubric.length||rubric.some(([idea,w])=>!Number.isInteger(w)||w<=0)||rubric.reduce((n,[idea,w])=>n+w,0)!==100)throw new Error("This checklist needs weights totaling 100.");
  if(!Array.isArray(r.awards)||r.awards.length!==rubric.length) throw new Error("The check returned incomplete marks. Try again.");
  const awards=rubric.map(([idea,weight],i)=>{
    const n=r.awards[i]; if(typeof n!=="number"||!Number.isFinite(n)) throw new Error("The check returned invalid marks. Try again.");
    return Math.round(Math.max(0,Math.min(weight,n)));
  });
  const score=Math.round(awards.reduce((a,n)=>a+n,0));
  return {v:3,score,awards,right:String(r.right||""),missing:rubric.map(([point,weight],i)=>({point,pct:Math.round(weight-awards[i])})).filter(x=>x.pct>0),guide:score<80?String(r.guide||""):"",rewatch:String(r.rewatch||"")};
}
const JSON_SHAPE=`Reply with only JSON: {"awards":[points for each fixed checklist item, in order],"right":"one short sentence","guide":"one short hint or correction if below 80%, otherwise empty","rewatch":"m:ss-m:ss or empty"}`;

function parkItems(b,actions){
  return (S.park[b.id]||[]).map((p,i)=>`<li><span class="at">${fmt(p.at)}</span><span class="txt">${esc(p.t)}</span>
   ${p.status!=="open"?`<span class="chip ${p.status}">${p.status==="later"?"later":"answered"}</span>`:""}
   ${actions?`<span class="row" style="margin:0">${sample?`<button class="btn ghost small" data-pask="${i}">Ask Claude</button>`:`<button class="btn ghost small" data-pcopy="${i}">Copy for Claude</button>`}<button class="btn ghost small" data-pset="${i}:later">Later</button><button class="btn ghost small" data-pset="${i}:done">Answered</button></span>
   <div class="pans small" id="pans-${i}" style="flex-basis:100%">${p.ans?esc(p.ans):""}</div>`:""}</li>`).join("");
}
function renderFb(fb){return `<div class="fb"><span class="verdict v-${fb.verdict}">${fb.verdict==="correct"?"Correct":fb.verdict==="partial"?"Partly there":"Not yet"}</span>\n${esc(fb.feedback)}${fb.followup?`\n\nFollow-up: ${esc(fb.followup)}`:""}</div>`}

let dueReviews=[], reviewsLoaded=false, reviewsError="", reviewResult="";

async function refreshReviews(){
  if(!helperReady)return;
  try{const r=await (await fetch("/api/reviews")).json();if(r.error)throw new Error(r.error);dueReviews=r.due||[];reviewsLoaded=true;reviewsError="";}

function reviewItem(row){
  const m=row.source.match(/^courses\/(.+)#([^/]+)(?:\/(iv|dbg)(\d+))?$/);
  if(!m||m[1]!==kitPath)return null;
  const b=blockById(m[2]);if(!b)return null;
  if(m[3]==="iv"){const iv=(b.interview||[])[+m[4]];return iv?{b,check:{q:iv.q,rubric:iv.strong}}:null;}
  if(m[3]==="dbg"){const c=(b.debug||[])[+m[4]];return c?{b,check:{q:c.task,rubric:c.strong},scenario:c.scenario}:null;}
  return {b,check:{...checkFor(b),q:b.reviewQuestion||checkFor(b).q}};
}
function renderReview(){
  const exp=`<details class="model"><summary>Optional flashcard export</summary><p>Use this only if you prefer Anki. The lesson does not require another flashcard queue.</p><button class="btn ghost" id="anki">Export cards (.tsv)</button></details>`;
  if(!helperReady)return `<section class="block"><h2>Review</h2><p>Start with <code>./study</code> to load your shared review schedule, or ask your tutor for <code>/review</code>.</p>${exp}</section>`;

  if(!item){const kit=row.source.split("#")[0];return `<section class="block">${head}<p>${esc(row.title)}</p><a class="btn" href="/${esc(kit)}/study-kit.html">Open this lesson to review</a></section>`;}
  const {check}=item, fb=reviewFeedback[row.unit];
  return `<section class="block">${head}<p>${md(check.q)}</p>${item.scenario||""}
  <textarea data-reviewanswer="${esc(row.unit)}" placeholder="From memory…">${esc(reviewAnswers[row.unit]||"")}</textarea>

function goNextStep(){
  const b=blockById(S.cur); if(!b) return;
  if(S.step==="recall"&&!(S.checkAnswers[b.id]||"").trim()){toast("Try a short answer first.");return}
  if(S.step==="experiment"&&!(S.practice[b.id]||"").trim()){toast("Note the result, or what remains to do.");return}
  (S.done[b.id]=S.done[b.id]||{})[S.step]=true;
  const st=stepsFor(b),i=st.findIndex(([k])=>k===S.step);
  if(i<st.length-1){S.step=st[i+1][0];}

    if(!S.completed[b.id]){S.cdate[b.id]=new Date().toISOString().slice(0,10);S.sessionParts=(S.sessionParts||0)+1;} S.completed[b.id]=true;
    const nb=D.blocks[idxOf(b)+1];

}

$("#view").addEventListener("click",async e=>{

      }

  }

  if(t.dataset.dbgcopy||t.dataset.dbgcheck){const id=t.dataset.dbgcopy||t.dataset.dbgcheck,[bid,qi]=id.split(":"),b=blockById(bid),c=b.debug[+qi],ans=(S.dbgans[id]||"").trim();
    if(!ans){toast("Write your answer first");return}

    t.disabled=true;const box=$("#dbgfb-"+CSS.escape(id));box.innerHTML=`<div class="fb muted">Thinking…</div>`;

    catch(err){box.innerHTML=`<div class="fb">${esc(err&&err.message||"Couldn't grade this time.")} Open the solution checklist.</div>`}

  if(t.dataset.ivcopy||t.dataset.ivcheck){const id=t.dataset.ivcopy||t.dataset.ivcheck,[bid,qi]=id.split(":"),b=blockById(bid),iv=b.interview[+qi],ans=(S.ivans[id]||"").trim();
    if(!ans){toast("Write your answer first");return}
    if(t.dataset.ivcopy){copy(ivPrompt(b,iv,ans),$("#ivcb-"+CSS.escape(id)));return}
    t.disabled=true;const box=$("#ivfb-"+CSS.escape(id));box.innerHTML=`<div class="fb muted">Thinking…</div>`;
    try{const r=await sample.json(ivPrompt(b,iv,ans)+"\n"+JSON_SHAPE);S.ivfb[id]=normFb(r,iv.strong);save();box.innerHTML=renderScore(S.ivfb[id]);}
    catch(err){box.innerHTML=`<div class="fb">Couldn't grade this time. Open “What a strong answer includes”.</div>`}
    finally{t.disabled=false}return}
  if(t.dataset.pset){const [i,st]=t.dataset.pset.split(":");const b=blockById(S.cur);S.park[b.id][+i].status=st;save();$("#plist").innerHTML=parkItems(b,true);return}
  if(t.dataset.pcopy){const b=blockById(S.cur),p=S.park[b.id][+t.dataset.pcopy];copy(`I'm studying "${D.title}", part "${b.title}" (${b.start}-${b.end}). While watching I parked this question at ${fmt(p.at)} into the part: "${p.t}". Answer it briefly in simple English. If Casey covers it later in the series, just say so and give a one-line preview.`,$("#pans-"+t.dataset.pcopy));return}
  if(t.dataset.pask){const i=+t.dataset.pask,b=blockById(S.cur),p=S.park[b.id][i],out=$("#pans-"+i);t.disabled=true;out.textContent="Thinking…";
    try{const r=await sample(`You are a tutor for one part of a programming video. Answer the student's parked question in under 120 words, simple English. If it's about something Casey parks for later, say so in one line and give at most a one-sentence preview.\n${blockContext(b)}\n\nQUESTION (asked at ${fmt(p.at)} into the part): ${p.t}`,{onText:({text})=>{out.textContent=text}});p.ans=r.text;p.status="done";save();$("#plist").innerHTML=parkItems(b,true);}
    catch(err){out.textContent=err.text||"Couldn't answer this time. Try again later.";t.disabled=false}return}
  if(t.id==="chatgo"){chat();return}
  if(t.id==="chatclear"){S.notes[S.cur]=[];save();render();return}
  if(t.id==="anki"){const rows=allCards().map(x=>[x.c[0],x.c[1],(D.cardTag||"study")+"::"+x.b.id].map(s=>s.replace(/\t|\n/g," ")).join("\t")).join("\n");
    const name=(D.storageKey||"cards")+"-anki.tsv";
    if(downloads){try{await downloads.save({filename:name,data:rows});}catch(err){toast("Export was not saved")}}
    else{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([rows],{type:"text/tab-separated-values"}));a.download=name;a.click();}
    return}
});
$("#view").addEventListener("input",e=>{
  const sc=e.target.dataset.shortcheck;if(sc){S.checkAnswers[sc]=e.target.value;delete S.checkFb[sc];const fb=$("#quickfb");if(fb)fb.innerHTML="";save()}
  const pd=e.target.dataset.practiced;if(pd){S.practiceDone[pd]=e.target.checked;save()}
  const pr=e.target.dataset.practice;if(pr){S.practice[pr]=e.target.value;S.practiceDone[pr]=false;const cb=document.querySelector(`[data-practiced="${pr}"]`);if(cb)cb.checked=false;save()}
  const ra=e.target.dataset.reviewanswer;if(ra){reviewAnswers[ra]=e.target.value;delete reviewFeedback[ra];const btn=$("#savereview");if(btn)btn.remove();const fb=$("#reviewfb");if(fb)fb.innerHTML="";}
  const a=e.target.dataset.ans; if(a){S.answers[a]=e.target.value;save()}
  const r=e.target.dataset.recall; if(r){S.recall[r]=e.target.value;save()}
  const v=e.target.dataset.iv; if(v){S.ivans[v]=e.target.value;save()}
  const g=e.target.dataset.dbg; if(g){S.dbgans[g]=e.target.value;save()}
  const gs=e.target.dataset.gs; if(gs){const [bid,gi]=gs.split(":");(S.guesses[bid]=S.guesses[bid]||[])[+gi]=e.target.value;save()}
  const lbk=e.target.dataset.lb; if(lbk){S.lb[lbk]=e.target.value;save()}
  if("autoask" in e.target.dataset){S.autoAsk=e.target.checked;save()}
});
async function chat(){
  const b=blockById(S.cur); const inp=$("#chatin"); const text=inp.value.trim(); if(!text) return;
  const log=S.notes[b.id]=S.notes[b.id]||[]; log.push({r:"user",c:text}); inp.value=""; save(); render(); $("#chathelp").open=true;
  const out=document.createElement("div"); out.className="msg a"; out.textContent="Thinking…"; $("#chatlog").append(out);
  const rules=`You tutor one student through this video part. Simple English. Stay inside the part's topic. If the question is about something Casey parks for later, say so in one line and give at most a one-sentence preview. Under 80 words. Answer only the question, with no repeated summary.\n${blockContext(b)}`;
  try{const r=await sample([{role:"user",content:rules},...log.slice(-8).map(m=>({role:m.r,content:m.c}))],{cache:false,onText:({text})=>{out.textContent=text}});log.push({r:"assistant",c:r.text});save();}
  catch(err){out.textContent=err.text||"Couldn't answer this time. Try again."}
}
save(); render();
})();
</script>
